# Publishes the installable game (tactics/web/, written by tactics/tools/build.py) to GitHub Pages:
# https://georgefseager-pixel.github.io/rae-rabbit/
# Runs whenever a new build of tactics/web is pushed, or by hand from the Actions tab.
name: Publish the game

on:
  push:
    branches: [main, claude/busy-hopper-hko7tb]
    paths: ['tactics/web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tactics/web
      - id: deployment
        uses: actions/deploy-pages@v4
