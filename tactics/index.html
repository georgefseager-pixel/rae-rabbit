<title>Raepublic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: portrait war-table. A felt command bar on top, the quilted battlefield in the middle, a stitched banner panel under the thumb. */
:root{
  --bg:#120d0c; --bg2:#1d1513; --navy:#212844; --navy2:#2c3559; --navy3:#3a4672;
  --cream:#efe3c8; --muted:#b4a68d; --red:#b5302a; --red-hi:#dc4a3c; --brass:#c9973f; --brass-hi:#ecc673;
  --frog:#6f9a3a; --frog-dk:#2c4a1c; --thread:rgba(239,227,200,.32);
  --stencil:'Saira Stencil One', 'Arial Narrow', Impact, sans-serif;
  --fell:'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --fell-i:'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --body:'Alegreya Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{color:var(--cream);font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(ellipse 90% 55% at 75% 100%, rgba(160,32,26,.38), transparent 70%),
    radial-gradient(ellipse 70% 40% at 15% 0%, rgba(201,151,63,.13), transparent 70%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.08) 0 2px, transparent 2px 5px),
    var(--bg)}
#app{height:100%;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;
  padding-block:8px 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ---- command bar ---- */
#top{display:flex;align-items:center;gap:7px}
#top .btn{font-size:14px;padding-inline:11px}
#turnBox{display:flex;flex-direction:column;line-height:1}
#turnBox small{font-family:var(--fell);font-size:11px;letter-spacing:.14em;color:var(--muted)}
#turn{font-family:var(--fell);font-size:24px;color:var(--brass-hi)}
#phase{font-family:var(--stencil);font-size:12px;padding:5px 10px 4px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  background:var(--red);color:var(--cream);border-radius:3px;outline:1.5px dashed rgba(239,227,200,.55);outline-offset:-4px;
  clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
#phase.e{background:var(--frog-dk);color:#d8eaa8}
#top .sp{flex:1}
.btn{font-family:var(--stencil);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--cream);
  background:var(--navy2);border:0;border-radius:8px;padding:10px 12px 9px;cursor:pointer;min-height:44px;white-space:nowrap;
  outline:1.5px dashed var(--thread);outline-offset:-5px;box-shadow:0 2px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)}
.btn:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn:disabled{opacity:.35}
.btn.primary{background:linear-gradient(180deg,#c9372f,#9e2722);outline-color:rgba(239,227,200,.6)}
.btn.on{background:#6b3a12;outline-color:#f0a050;color:#ffd9a8}

/* ---- board ---- */
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{display:block;border-radius:10px;touch-action:none;
  box-shadow:0 0 0 4px #2a1c15, 0 0 0 5px rgba(201,151,63,.55), 0 0 0 9px #1a110d, 0 22px 50px rgba(0,0,0,.7)}

/* ---- banner panel ---- */
#panel{position:relative;background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, var(--navy2), var(--navy));
  border-radius:12px;padding:14px;min-height:156px;box-sizing:border-box;display:flex;flex-direction:column;gap:9px;
  outline:1.5px dashed var(--thread);outline-offset:-7px;box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.05)}
.hint{color:var(--muted);font-size:15px;line-height:1.45}
.hint b{color:var(--cream)}
.hint em{font-family:var(--fell-i);font-size:16px;color:var(--cream)}
.urow{display:flex;gap:12px;align-items:stretch}
.por{width:70px;height:86px;flex:none;border-radius:6px;background-color:#151a2e;background-repeat:no-repeat;
  box-shadow:0 0 0 2px var(--brass), 0 0 0 4px #141010;position:relative;overflow:hidden}
.por.e{background-color:#1b2612;box-shadow:0 0 0 2px #7a8f3a, 0 0 0 4px #141010}
.por.rae{background-image:url(art/rae.webp);background-size:225% auto;background-position:50% 5%}
.por.p:not(.rae){background-image:radial-gradient(circle at 50% 30%, #34406b, #151a2e 75%)}
.por.e{background-image:radial-gradient(circle at 50% 30%, #34501f, #141c0d 75%)}
.por img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.uinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.uhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.uhead .nm{font-family:var(--fell);font-size:21px;line-height:1}
.uhead .cl{color:var(--muted);font-size:13px}
.tr{font-size:12px;color:var(--muted)}
.tr b{color:var(--brass-hi);font-weight:500}
.hprow{display:flex;align-items:center;gap:8px;font-family:var(--fell);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{flex:1;height:9px;background:#0b0d16;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bar i{display:block;height:100%;background:#6fbf6a;transition:width .3s ease}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;text-align:center}
.stats div{background:rgba(10,12,24,.45);border-radius:6px;padding:4px 0 3px;outline:1px dashed rgba(239,227,200,.13);outline-offset:-3px}
.stats small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats span{font-family:var(--fell);font-size:18px;font-variant-numeric:tabular-nums;color:var(--cream)}
.meta{font-size:13px;color:var(--muted);line-height:1.35}
.meta b{color:var(--cream);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:70px}
.fc{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 10px;align-items:center;text-align:center;font-variant-numeric:tabular-nums}
.fc .h{font-family:var(--fell);font-size:18px}
.fc .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fc .v{font-family:var(--fell);font-size:21px}
.fc .pc{color:#f2d9a8}.fc .ec{color:#c6e08a}
.adv{color:#7fe08a}.dis{color:#ff7b6b}

/* ---- overlays ---- */
.ov{position:fixed;inset:0;display:flex;align-items:safe center;justify-content:center;overflow-y:auto;background:rgba(8,6,5,.78);z-index:20;box-sizing:border-box;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.card{background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:12px;padding:22px;max-width:360px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;
  outline:1.5px dashed var(--thread);outline-offset:-8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card h1{font-family:var(--stencil);font-size:34px;margin:0;line-height:1;color:var(--cream);letter-spacing:.04em;text-wrap:balance}
.card h2{font-family:var(--fell-i);font-style:italic;font-size:18px;margin:0;font-weight:400;color:var(--brass-hi)}
.card p{font-size:15px;line-height:1.5;color:#d8cdb4;margin:0}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.lv div{background:rgba(10,12,24,.45);border-radius:6px;padding:6px 0;font-family:var(--fell);font-size:20px}
.lv small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.lv .up{color:var(--brass-hi);background:rgba(201,151,63,.18)}

/* title */
#title{background:
  radial-gradient(ellipse 120% 60% at 50% 30%, rgba(170,35,28,.42), transparent 70%),
  radial-gradient(ellipse at 50% 120%, rgba(201,151,63,.18), transparent 60%), #0d0908;padding:0;align-items:stretch;overflow:hidden}
.tl{position:relative;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(26px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));box-sizing:border-box;min-height:100%}
.tl .art{position:absolute;left:50%;top:0;height:78%;max-width:none;transform:translateX(-50%);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 98%);mask-image:linear-gradient(180deg,#000 55%,transparent 98%);
  animation:artIn 1.6s cubic-bezier(.2,.7,.2,1) both}
.tl .txt{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.kicker{font-family:var(--fell);font-size:13px;letter-spacing:.32em;color:var(--brass-hi);text-transform:uppercase;animation:up .9s .5s both}
.logo{font-family:var(--stencil);font-size:clamp(52px, 16vw, 84px);line-height:.9;letter-spacing:.03em;margin:0;color:var(--cream);
  text-shadow:0 3px 0 #6e1b16, 0 6px 22px rgba(0,0,0,.8);animation:stamp .7s .7s cubic-bezier(.2,1.5,.4,1) both}
.rule{width:min(300px,80%);height:12px;background:var(--red);clip-path:polygon(0 30%,3% 0,97% 10%,100% 45%,98% 100%,2% 85%);position:relative;animation:up .8s 1s both}
.rule::after{content:"";position:absolute;left:4%;right:4%;top:50%;border-top:1.5px dashed rgba(239,227,200,.7)}
.tag{font-family:var(--fell-i);font-style:italic;font-size:20px;color:#e8dcc2;margin:0;animation:up .8s 1.15s both}
.tl .btn{margin-top:10px;font-size:18px;padding:14px 26px;animation:up .8s 1.35s both}
@keyframes artIn{from{opacity:0;transform:translateX(-50%) scale(1.06) translateY(14px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:scale(1.6) rotate(-4deg)}to{opacity:1;transform:none}}

/* dialogue */
#talk{background:linear-gradient(180deg, rgba(8,6,5,.25), rgba(8,6,5,.88) 60%);align-items:flex-end}
.tbox{position:relative;width:100%;max-width:520px;margin:0 auto}
.tpor{position:absolute;bottom:calc(100% - 26px);left:6px;width:150px;height:190px;border-radius:8px;overflow:hidden;
  box-shadow:0 0 0 2px var(--brass), 0 0 0 5px #120c0a, 0 16px 30px rgba(0,0,0,.6);background:#151a2e center/cover no-repeat}
.tpor.rae{background-image:url(art/rae.webp);background-size:200% auto;background-position:50% 4%}
.tpor.e{box-shadow:0 0 0 2px #7a8f3a, 0 0 0 5px #120c0a, 0 16px 30px rgba(0,0,0,.6);background-image:radial-gradient(circle at 50% 35%, #3d5a22, #10170a 75%)}
.tpor.p:not(.rae){background-image:radial-gradient(circle at 50% 35%, #3a4672, #12162a 75%)}
.tpor img{width:100%;height:100%;object-fit:contain}
.tbody{background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:12px;padding:30px 18px 18px;min-height:120px;box-sizing:border-box;
  outline:1.5px dashed var(--thread);outline-offset:-7px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.tbody.narr{background:linear-gradient(180deg,#2a1915,#170e0c);text-align:center;padding-top:20px}
.tname{position:absolute;top:-14px;left:170px;font-family:var(--fell);font-size:19px;padding:4px 14px 3px;background:var(--red);border-radius:3px;
  outline:1.5px dashed rgba(239,227,200,.55);outline-offset:-4px}
.tname.e{background:var(--frog-dk);color:#d8eaa8}
.ttext{font-family:var(--fell-i);font-size:19px;line-height:1.45;color:#efe5cf;min-height:3em}
.tbody.narr .ttext{font-style:italic;color:#e3cfa8}
.tmore{position:absolute;right:16px;bottom:10px;color:var(--brass-hi);font-size:14px;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
#skip{position:fixed;top:max(12px, env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));z-index:21;font-size:13px;min-height:38px;padding:8px 12px}

/* battle scene */
#duel{position:absolute;inset:-6px;z-index:10;border-radius:12px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 50%, rgba(40,10,8,.82), rgba(6,4,4,.94));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.stage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:center;padding:14px}
.ftr{display:flex;flex-direction:column;gap:7px;min-width:0;position:relative}
.pf{height:min(250px, 44vh);border-radius:8px;overflow:hidden;position:relative;background:#151a2e center/cover no-repeat;
  box-shadow:0 0 0 2px var(--brass), 0 0 0 5px #120c0a, 0 14px 30px rgba(0,0,0,.6)}
.pf.rae{background-image:url(art/rae.webp);background-size:cover;background-position:50% 12%}
.pf.p:not(.rae){background-image:radial-gradient(circle at 50% 38%, #3a4672, #12162a 80%)}
.pf.e{box-shadow:0 0 0 2px #7a8f3a, 0 0 0 5px #120c0a, 0 14px 30px rgba(0,0,0,.6);background-image:radial-gradient(circle at 50% 38%, #3d5a22, #0f1609 80%)}
.pf img{width:100%;height:100%;object-fit:contain}
.ftr.R .pf img{transform:scaleX(-1)}
.plate{background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;outline:1px dashed var(--thread);outline-offset:-4px}
.ftr.R .plate{background:linear-gradient(180deg,#2f4320,#1a2610)}
.plate .nm{font-family:var(--fell);font-size:17px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .ds{font-size:11px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.pop{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--stencil);font-size:44px;color:#fff;pointer-events:none;opacity:0;
  text-shadow:0 3px 0 #000, 0 0 18px rgba(0,0,0,.9)}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--stencil);font-size:30px;color:var(--brass-hi);text-shadow:0 2px 0 #000;z-index:2;pointer-events:none}
.stampx{position:absolute;left:50%;top:44%;font-family:var(--stencil);font-size:40px;color:var(--red-hi);border:4px solid var(--red-hi);padding:4px 14px 2px;border-radius:6px;
  transform:translate(-50%,-50%) rotate(-9deg);opacity:0;pointer-events:none;z-index:3;background:rgba(20,6,5,.55);white-space:nowrap;letter-spacing:.06em}
.dhint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.08em}
@media (prefers-reduced-motion: reduce){ .tl .art,.kicker,.logo,.rule,.tag,.tl .btn{animation:none} .tmore{animation:none} }
</style>

<div id="app">
  <div id="top">
    <div id="turnBox"><small>Turn</small><span id="turn">I</span></div>
    <span id="phase">Raepublic</span>
    <span class="sp"></span>
    <button class="btn" id="dangerBtn" type="button">Danger</button>
    <button class="btn primary" id="endBtn" type="button">End Turn</button>
  </div>
  <div id="board"><canvas id="cv"></canvas>
    <div id="duel" hidden>
      <div class="stage">
        <div class="ftr L" id="dL"><div class="pf"></div><div class="plate"><div class="nm"></div><div class="hprow"><span class="hpn"></span><div class="bar"><i></i></div></div><div class="ds"></div></div><div class="pop"></div></div>
        <div class="ftr R" id="dR"><div class="pf"></div><div class="plate"><div class="nm"></div><div class="hprow"><span class="hpn"></span><div class="bar"><i></i></div></div><div class="ds"></div></div><div class="pop"></div></div>
      </div>
      <div class="vs">VS</div>
      <div class="stampx" id="stamp"></div>
      <div class="dhint">Tap to speed up</div>
    </div>
  </div>
  <div id="panel"><div class="hint">Loading…</div></div>
</div>

<div class="ov" id="title">
  <div class="tl">
    <img class="art" src="art/rae.webp" alt="Rae Rabbit in patchwork armour, holding a sword, red scarf flowing">
    <div class="txt">
      <div class="kicker">A Chronicle of the Toybox War</div>
      <h1 class="logo">RAEPUBLIC</h1>
      <div class="rule"></div>
      <p class="tag">Soft things are hard to break.</p>
      <button class="btn primary" id="startBtn" type="button">Raise the Banner</button>
    </div>
  </div>
</div>
<div class="ov" id="talk" hidden>
  <div class="tbox"><div class="tpor" id="tpor"></div><div class="tname" id="tname"></div>
    <div class="tbody" id="tbody"><div class="ttext" id="ttext"></div><div class="tmore">▼</div></div></div>
</div>
<button class="btn" id="skip" type="button" hidden>Skip</button>
<div class="ov" id="lvl" hidden><div class="card" id="lvlCard"></div></div>
<div class="ov" id="over" hidden><div class="card" id="overCard"></div></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cvs = $('#cv'), ctx = cvs.getContext('2d'), boardEl = $('#board'), panel = $('#panel');
const ART = new Image(); ART.src = 'art/rae.webp';

// ================= Map =================
const COLS = 8, ROWS = 12;
const MAP = [
  "MM.FT.MM",
  "M..F...M",
  "F...FF..",
  "..F....F",
  "WWBWWWBW",
  "F......F",
  ".FF..M..",
  "...F.MF.",
  "M......F",
  ".F..F...",
  "..T....F",
  "F......M",
];
const TER = {
  '.': {n:'Meadow Patch', def:0, avo:0, cost:1},
  'F': {n:'Felt Thicket', def:1, avo:20, cost:2},
  'M': {n:'Pillow Hills', def:2, avo:30, cost:3},
  'W': {n:'Stitchwater', def:0, avo:0, cost:99},
  'B': {n:'Lolly-Stick Bridge', def:0, avo:0, cost:1},
  'T': {n:'Block Fort', def:2, avo:20, cost:1, heal:true},
};
const ter = (x,y) => TER[MAP[y][x]];

// ================= Cast =================
// look: species + colours + gear, used to draw tokens and portraits
const LOOKS = {
  rae:     {sp:'bun', ears:'lop', fur:'#e2c79c', light:'#f4e3c2', dark:'#9c8058', scarf:'#b5302a', gear:'fist'},
  thimble: {sp:'bun', ears:'lop', fur:'#8f8279', light:'#b2a69c', dark:'#5a4f48', scarf:'#2e3d66', gear:'helm'},
  clover:  {sp:'bun', ears:'up',  fur:'#c99a6c', light:'#e3bf96', dark:'#87613f', scarf:'#2e3d66', gear:'shoe'},
  willow:  {sp:'bun', ears:'up',  fur:'#a9a8a6', light:'#cfcecb', dark:'#6c6b69', scarf:'#5b2a52', gear:'monocle'},
  flopsy:  {sp:'bun', ears:'lop', fur:'#d4b48c', light:'#ead2ae', dark:'#977651', scarf:'#d77a8c', gear:'heart', small:true},
  bramble: {sp:'bun', ears:'up',  fur:'#7a5538', light:'#9c7452', dark:'#4a3220', scarf:'#b5302a', gear:'bandana'},
  bruiser: {sp:'frog', skin:'#4f7f33', light:'#6f9c48', dark:'#2a4519', belly:'#a9c46c', gear:'collar'},
  lily:    {sp:'frog', skin:'#5e9a3c', light:'#80b85a', dark:'#2f5320', belly:'#bfd98a', gear:'lilypad'},
  reed:    {sp:'frog', skin:'#6a8f3a', light:'#8cad55', dark:'#33491b', belly:'#c5d58c', gear:'reed'},
  tiggle:  {sp:'frog', skin:'#7bc043', light:'#a1db6a', dark:'#3d6a1e', belly:'#d8ee9c', gear:'bandana', small:true},
  jiggle:  {sp:'frog', skin:'#5b8a2f', light:'#7fae4c', dark:'#2b4415', belly:'#c9d98e', gear:'crown', big:true},
};
const CLASSES = {
  captain: {name:'Banner-Captain', w:'sword', rng:[1,1], mt:'foot',    g:{mhp:70,atk:45,def:30,spd:50,skl:45}},
  bulwark: {name:'Bulwark',        w:'lance', rng:[1,1], mt:'armor',   g:{mhp:80,atk:45,def:55,spd:20,skl:35}},

// ================= Movement & ranges =================
function reach(u){
  const map = new Map([[K(u.x,u.y), {d:0, prev:-1}]]), open = [K(u.x,u.y)];
  while (open.length){
    open.sort((a,b) => map.get(a).d - map.get(b).d);
    const cur = open.shift(), cd = map.get(cur).d, cx = KX(cur), cy = KY(cur);
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cx+dx, ny = cy+dy;
      if (nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      const c = moveCost(u,nx,ny); if (c>=99) continue;
      const o = unitAt(nx,ny); if (o && o.team !== u.team) continue;
      const nd = cd + c; if (nd > u.mov) continue;
      const nk = K(nx,ny), prev = map.get(nk);
      if (!prev || nd < prev.d){ map.set(nk, {d:nd, prev:cur}); open.push(nk); }
    }
  }
  return map;
}
const destinations = (u, map) => [...map.keys()].filter(k => { const o = unitAt(KX(k),KY(k)); return !o || o === u; });
function rangeTiles(fromKeys, rng){
  const out = new Set();
  for (const k of fromKeys){
    const x = KX(k), y = KY(k);
    for (let dy=-rng[1]; dy<=rng[1]; dy++) for (let dx=-rng[1]; dx<=rng[1]; dx++){
      const d = Math.abs(dx)+Math.abs(dy), nx = x+dx, ny = y+dy;
      if (d<rng[0]||d>rng[1]||nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      out.add(K(nx,ny));
    }
  }
  return out;
}
function pathTo(map, k){ const p = []; while (k !== -1){ p.unshift(k); k = map.get(k).prev; } return p; }
function threat(u){
  if (u.w === 'staff') return new Set();
  return rangeTiles(u.ai === 'hold' ? [K(u.x,u.y)] : destinations(u, reach(u)), u.rng);
}
function updateDanger(){
  dangerKeys = new Set();
  if (showDanger) for (const e of team('e')) for (const k of threat(e)) dangerKeys.add(k);
}

// ================= Combat math =================
function calc(a, d, ap, dp){
  if (a.w === 'staff') return {can:false, dmg:0, hit:0, crit:0, dbl:false, tri:0};
  const t = ter(dp.x, dp.y), tri = triangle(a.w, d.w), dist = man(ap, dp);
  return {
    can: dist >= a.rng[0] && dist <= a.rng[1],
    dmg: Math.max(0, a.atk + tri - (d.def + t.def)),
    hit: clamp(75 + a.skl*2 + tri*15 - (d.spd*2 + t.avo), 0, 100),
    crit: clamp(Math.floor(a.skl/2) - Math.floor(d.skl/4), 0, 100),
    dbl: a.spd - d.spd >= 4, tri,
  };
}
const healAmt = u => 8 + Math.floor(u.atk/2);

const ease = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
const tween = (dur, fn) => new Promise(res => tweens.push({t0: performance.now(), dur: dur/speed, fn, res}));
const wait = ms => tween(ms, () => {});
function popup(u, text, color){ popups.push({x:u.x+.5, y:u.y+.3, text, color, t0: performance.now(), dur: 950}); }
const anim = (el, kf, dur, opt={}) => el.animate(kf, Object.assign({duration: dur/speed, easing:'ease-out', fill:'none'}, opt)).finished.catch(()=>{});

async function moveAlong(u, path){
  for (let i=1; i<path.length; i++){
    const fx = KX(path[i-1]), fy = KY(path[i-1]), tx = KX(path[i]), ty = KY(path[i]);
    await tween(80, t => { u.px = fx + (tx-fx)*t; u.py = fy + (ty-fy)*t; });
  }
  const last = path[path.length-1];
  u.x = u.px = KX(last); u.y = u.py = KY(last);
}

async function strike(a, d, f){
  const dx = d.x - a.x, dy = d.y - a.y, len = Math.hypot(dx,dy), ranged = man(a,d) > 1;
  const lx = dx/len*(ranged ? .12 : .32), ly = dy/len*(ranged ? .12 : .32);
  const scene = !duel.hidden, A = dEl[sideOf(a)], D = dEl[sideOf(d)], dir = a.team === 'p' ? 1 : -1;
  if (scene) anim(A.querySelector('.pf'), [{transform:'none'},{transform:`translateX(${dir*(ranged?14:46)}px) rotate(${dir*3}deg)`},{transform:'none'}], 380, {easing:'ease-in-out'});
  await tween(140, t => { a.ox = lx*t; a.oy = ly*t; });
  if (ranged){
    const s = {x0:a.x+.5, y0:a.y+.5, x1:d.x+.5, y1:d.y+.5, t:0}; shots.push(s);
    await tween(170, t => { s.t = t; }); shots.splice(shots.indexOf(s), 1);
  }
  const roll = (Math.random()*100 + Math.random()*100) / 2;
  if (roll < f.hit){
    const crit = Math.random()*100 < f.crit, dmg = crit ? f.dmg*3 : f.dmg;
    const from = d.hp; d.hp = Math.max(0, d.hp - dmg);
    popup(d, crit ? `${dmg}!` : dmg === 0 ? '0' : String(dmg), crit ? '#ffd166' : '#ffffff');
    if (crit){ shake = 1; if (scene){ stamp('CRITICAL', '#ffcf5a'); anim(duel, [{transform:'translate(0,0)'},{transform:'translate(-8px,5px)'},{transform:'translate(7px,-4px)'},{transform:'translate(-4px,2px)'},{transform:'none'}], 380); } }
    if (scene){
      duelPop(d, dmg === 0 ? 'NO DAMAGE' : String(dmg), crit ? '#ffcf5a' : '#fff');
      anim(D.querySelector('.pf'), [{filter:'brightness(3) saturate(0)', transform:`translateX(${-dir*10}px)`},{filter:'none', transform:'none'}], 340);
      setDuelHp(d);
    }
    tween(280, t => { d.flash = 1 - t; d.shp = from + (d.hp - from)*t; });
  } else {
    popup(d, 'Miss', '#c5d3e3');
    if (scene){ duelPop(d, 'MISS', '#c5d3e3'); anim(D.querySelector('.pf'), [{transform:'none'},{transform:`translateX(${-dir*26}px)`},{transform:'none'}], 380); }
  }
  await tween(150, t => { a.ox = lx*(1-t); a.oy = ly*(1-t); });
  await wait(scene ? 380 : 220);
  if (d.hp <= 0){
    if (scene){
      stamp('UNSTITCHED', '#e8493b');
      anim(D.querySelector('.pf'), [{filter:'none', transform:'none'},{filter:'grayscale(1) brightness(.45)', transform:`translateY(18px) rotate(${-dir*6}deg)`}], 700, {fill:'forwards'});
      await wait(500);
    }
    await tween(380, t => { d.alpha = 1 - t; }); d.dead = true;
  }
}

async function doCombat(a, d){
  if ((a.boss || d.boss) && !bossTalked){
    bossTalked = true;
    const r = a.boss ? d : a;
    await talk([{who:'jiggle', text:'Do you know what you ARE, rabbit? Stuffing and thread. You were MADE to be held.'}, {who:r.key, text:RETORT[r.key]}]);
  }
  const A = calc(a, d, a, d), D = calc(d, a, d, a);
  const seq = [[a,d,A]];
  if (D.can) seq.push([d,a,D]);
  if (A.dbl) seq.push([a,d,A]); else if (D.can && D.dbl) seq.push([d,a,D]);
  const hp0 = {a: a.hp, d: d.hp};
  speed = 1;
  await openDuel(a, d);
  for (const [x,y,f] of seq){ if (a.dead || d.dead) break; await strike(x,y,f); }
  await closeDuel();
  speed = 1;
  const p = a.team === 'p' ? a : d, e = p === a ? d : a;
  if (!p.dead){
    const dealt = (p === a ? hp0.d - d.hp : hp0.a - a.hp) > 0;
    const xp = e.dead ? Math.max(10, 30 + (e.lv - p.lv)*3 + (e.boss ? 40 : 0)) : dealt ? Math.max(1, 10 + (e.lv - p.lv)) : 1;
    await giveExp(p, xp);
  }
}

async function levelUp(u){

function talk(lines){
  return new Promise(res => {
    const ov = $('#talk'), txt = $('#ttext'), box = $('#tbody'), por = $('#tpor'), nm = $('#tname'), skip = $('#skip');
    let i = -1, typing = null, full = '';
    const finish = () => { ov.hidden = true; skip.hidden = true; ov.onclick = null; skip.onclick = null; clearInterval(typing); res(); };
    const show = () => {
      i++; if (i >= lines.length) return finish();
      const l = lines[i], foe = ['jiggle','tiggle'].includes(l.who), narr = l.who === 'narr';
      box.className = 'tbody' + (narr ? ' narr' : '');
      por.hidden = narr; nm.hidden = narr;

        nm.className = 'tname' + (foe ? ' e' : ''); nm.textContent = SPEAK[l.who].name;
      }
      full = l.text; let n = 0; txt.textContent = '';
      clearInterval(typing);
      typing = setInterval(() => { n += 2; txt.textContent = full.slice(0, n); if (n >= full.length){ clearInterval(typing); typing = null; } }, 22);
    };
    ov.onclick = () => { if (typing){ clearInterval(typing); typing = null; txt.textContent = full; } else show(); };
    skip.onclick = e => { e.stopPropagation(); finish(); };
    ov.hidden = false; skip.hidden = false; show();
  });
}

const setPanel = html => { panel.innerHTML = html; };

  const left = team('p').filter(u => !u.moved).length;

function refreshTop(){
  $('#turn').textContent = ROMAN(turn);

  $('#phase').className = phase === 'p' ? '' : 'e';

// ================= Player flow =================
const enemiesInRange = u => team(u.team==='p'?'e':'p').filter(o => { const d = man(u,o); return d>=u.rng[0] && d<=u.rng[1]; });
const healTargets = u => team(u.team).filter(o => o !== u && man(u,o) === 1 && o.hp < o.mhp);
function clearSel(){ sel = null; orig = null; reachMap = null; moveKeys = new Set(); atkKeys = new Set(); healKeys = new Set(); targets = []; fc = null; tmode = null; }

function select(u){
  clearSel(); inspect = null;
  sel = u; orig = {x:u.x, y:u.y}; reachMap = reach(u);
  moveKeys = new Set(destinations(u, reachMap));
  for (const k of rangeTiles(moveKeys, u.rng)) if (!moveKeys.has(k)) (u.w === 'staff' ? healKeys : atkKeys).add(k);
  mode = 'selected'; panelSelected(u); refreshTop();
}
function openActions(){
  mode = 'action'; moveKeys = new Set(); atkKeys = new Set(); healKeys = new Set(); targets = []; fc = null;
  for (const k of rangeTiles([K(sel.x,sel.y)], sel.rng)) (sel.w === 'staff' ? healKeys : atkKeys).add(k);
  panelActions(sel); refreshTop();
}
function startTargeting(kind){
  mode = 'target'; tmode = kind;
  targets = kind === 'attack' ? enemiesInRange(sel) : healTargets(sel);
  if (targets.length === 1) chooseTarget(targets[0]);
  else setPanel(`<div class="hint">Tap a highlighted ${kind==='attack'?'frog':'comrade'}.</div><div class="acts"><button class="btn" data-act="back" type="button">Back</button></div>`);
}
function chooseTarget(t){ fc = t; tmode === 'attack' ? panelForecast(sel, t) : panelHeal(sel, t); }
async function afterAction(){
  mode = 'idle'; updateDanger();
  if (await checkEnd()) return;
  panelIdle(); refreshTop();
  if (team('p').every(p => p.moved)){ await wait(350); enemyPhase(); }
}
async function finishUnit(u){ u.moved = true; clearSel(); await afterAction(); }

async function onTap(x, y){
  if (busy || phase !== 'p') return;
  cursor = {x, y};
  const u = unitAt(x, y), k = K(x, y);
  if (mode === 'idle' || mode === 'selected'){
    if (mode === 'selected'){
      if (u === sel){ openActions(); return; }
      if (moveKeys.has(k) && !u){
        busy = true; refreshTop();
        await moveAlong(sel, pathTo(reachMap, k));
        busy = false; openActions(); return;
      }
    }
    if (u && u.team === 'p' && !u.moved){ select(u); return; }
    clearSel(); mode = 'idle';
    if (u){ inspect = u.team === 'e' && inspect !== u ? u : null; setPanel(unitHTML(u)); }
    else {
      inspect = null;
      const t = ter(x,y), ch = MAP[y][x];
      const flavour = {'.':'Soft green felt, well trodden.', F:'Felt pines, hand-cut. Good cover.', M:'Stacked cushions. Hard going, harder to hit.',
        W:'A ribbon of blue satin. No one swims in satin.', B:'Lolly sticks and glue. It holds.', T:'Toy blocks, stacked high. Restores 20% HP at the start of each phase.'}[ch];
      setPanel(`<div class="uhead"><span class="nm">${t.n}</span><span class="cl">${t.cost>=99?'Impassable':`Move cost ${t.cost}`}</span></div>
        <div class="hint"><em>${flavour}</em></div>
        <div class="hint">${t.def||t.avo?`Units here gain <b>+${t.def} Def</b> and <b>+${t.avo} Avoid</b>.`:'No cover.'}${ch==='F'?' Outriders pay 3 to enter.':''}${ch==='M'?' Outriders and Bulwarks cannot climb.':''}</div>`);
    }
    refreshTop(); return;
  }
  if (mode === 'action'){
    if (u && sel.w !== 'staff' && enemiesInRange(sel).includes(u)){ startTargeting('attack'); chooseTarget(u); }
    else if (u && sel.w === 'staff' && healTargets(sel).includes(u)){ startTargeting('heal'); chooseTarget(u); }
    return;
  }
  if (mode === 'target' && u && targets.includes(u)){ if (fc === u) act('confirm'); else chooseTarget(u); }
}

async function act(a){
  if (busy) return;
  if (a === 'attack') startTargeting('attack');
  else if (a === 'heal') startTargeting('heal');
  else if (a === 'wait') finishUnit(sel);
  else if (a === 'cancel'){ const u = sel; place(u, orig.x, orig.y); select(u); }
  else if (a === 'back') openActions();
  else if (a === 'confirm' && fc){
    busy = true; refreshTop();
    const u = sel, t = fc, kind = tmode; mode = 'busy'; targets = []; atkKeys = new Set(); healKeys = new Set();
    setPanel(`<div class="hint"><em>${kind==='attack'?`${u.name} strikes at ${t.name}…`:`${u.name} mends ${t.name}…`}</em></div>`);
    if (kind === 'attack') await doCombat(u, t); else await doHeal(u, t);
    busy = false;
    if (u.dead){ clearSel(); await afterAction(); return; }
    finishUnit(u);
  }
}
panel.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act); });

// ================= Phases =================
async function showBanner(text, sub, side){ banner = {text, sub, side, t0: performance.now(), dur: 1400}; await wait(1400); banner = null; }
async function fortHeal(t){
  for (const u of team(t)){
    if (ter(u.x,u.y).heal && u.hp < u.mhp){
      const amt = Math.min(u.mhp - u.hp, Math.max(1, Math.round(u.mhp*.2))), from = u.hp;
      u.hp += amt; popup(u, `+${amt}`, '#9ff0b0'); tween(300, k => { u.shp = from + amt*k; });
    }
  }
  await wait(300);
}
async function startPlayerPhase(){
  phase = 'p'; busy = true; mode = 'busy';
  for (const u of team('p')) u.moved = false;
  refreshTop(); panelIdle();
  await showBanner('THE RAEPUBLIC MARCHES', `Turn ${ROMAN(turn)}`, 'p');
  await fortHeal('p');
  busy = false; mode = 'idle'; updateDanger(); panelIdle(); refreshTop();
}
async function enemyPhase(){
  clearSel(); inspect = null; phase = 'e'; busy = true; mode = 'busy'; refreshTop(); panelIdle();
  await showBanner('THE FRIGGLIARCHY STIRS', `Turn ${ROMAN(turn)}`, 'e');
  await fortHeal('e');
  for (const e of team('e')){
    if (e.dead) continue;
    await aiAct(e);
    if (await checkEnd()) return;
  }
  turn++; busy = false;
  startPlayerPhase();
}

// ================= Enemy AI =================
function distField(e){
  const f = new Array(COLS*ROWS).fill(Infinity), open = [];
  for (const p of team('p')){ const k = K(p.x,p.y); f[k] = 0; open.push(k); }
  while (open.length){
    open.sort((a,b) => f[a]-f[b]);
    const cur = open.shift(), cx = KX(cur), cy = KY(cur);
    const step = f[cur] === 0 ? 1 : moveCost(e, cx, cy);
    if (step >= 99) continue;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cx+dx, ny = cy+dy; if (nx<0||ny<0||nx>=COLS||ny>=ROWS) continue;
      if (moveCost(e,nx,ny) >= 99) continue;
      const nk = K(nx,ny), nd = f[cur] + step;
      if (nd < f[nk]){ f[nk] = nd; open.push(nk); }
    }
  }
  return f;
}
async function aiAct(e){
  if (e.ai === 'guard' && !e.triggered){
    const th = threat(e);
    if (team('p').some(p => th.has(K(p.x,p.y)))) e.triggered = true; else return;
  }
  const map = e.ai === 'hold' ? new Map([[K(e.x,e.y), {d:0, prev:-1}]]) : reach(e);
  const dests = destinations(e, map);
  let best = null;
  for (const dk of dests){
    const pos = {x:KX(dk), y:KY(dk)};
    for (const p of team('p')){
      const d = man(pos, p); if (d < e.rng[0] || d > e.rng[1]) continue;
      const A = calc(e, p, pos, p), D = calc(p, e, p, pos), hits = A.dbl ? 2 : 1;
      let score = A.dmg * A.hit/100 * hits;
      if (A.dmg * hits >= p.hp) score += 40 * A.hit/100;
      if (D.can) score -= D.dmg * D.hit/100 * (D.dbl ? 2 : 1) * .4;
      score += ter(pos.x,pos.y).def * 1.5 + (p.lord ? 2 : 0) - map.get(dk).d * .05;
      if (!best || score > best.score) best = {score, dk, p};
    }
  }
  inspect = e;
  if (best){
    await wait(250);
    if (best.dk !== K(e.x,e.y)) await moveAlong(e, pathTo(map, best.dk));
    await wait(150);
    inspect = null;
    await doCombat(e, best.p);
    updateDanger();
    return;
  }
  if (e.ai === 'hold'){ inspect = null; return; }
  const f = distField(e);
  let bk = K(e.x,e.y);
  for (const dk of dests) if (f[dk] < f[bk] || (f[dk] === f[bk] && map.get(dk).d < map.get(bk).d)) bk = dk;
  if (bk !== K(e.x,e.y)){ await wait(200); await moveAlong(e, pathTo(map, bk)); await wait(120); }
  inspect = null; updateDanger();
}

// ================= End =================
async function checkEnd(){
  const lord = units.find(u => u.lord), boss = units.find(u => u.boss);
  if (lord.dead || !team('p').length){ busy = true; mode = 'over';
    await talk([{who:'narr', text:'Rae Rabbit falls. The banner drops into the satin and is carried away downstream.'},{who:'jiggle', text:'Back to the mills with the rest of them. The King will hear of this. He will laugh.'}]);
    endScreen(false); return true; }
  if (boss.dead || !team('e').length){ busy = true; mode = 'over';
    await talk([{who:'jiggle', text:'The King… will unpick… every last one of you…'},{who:'rae', text:'Let him try. We know how to sew.'},
      {who:'narr', text:'Stitchwater Ford is taken. By morning, every mill in the Toybox has heard: the Raepublic is real.'}]);
    endScreen(true); return true; }
  return false;
}
function endScreen(win){
  busy = true; mode = 'over'; refreshTop();
  const fallen = units.filter(u => u.team==='p' && u.dead).map(u => u.name);
  $('#overCard').innerHTML = win
    ? `<h1>STITCHWATER IS FREE</h1><h2>Chapter I complete · ${turn} turn${turn===1?'':'s'}</h2>

    : `<h1>THE BANNER FALLS</h1><h2>The Friggliarchy endures. For now.</h2>
       <p>Draw the frogs out a few at a time, fight from the felt thickets, and keep Flopsy behind the line.</p>
       <button class="btn primary" id="again" type="button">Try Again</button>`;
  $('#over').hidden = false;
  $('#again').onclick = () => { $('#over').hidden = true; newBattle(); busy = false; startPlayerPhase(); };
  setPanel(`<div class="hint"><em>${win ? 'Victory.' : 'Defeat.'}</em></div>`);
}

// ================= Plush drawing =================
function ell(g, x, y, rx, ry, rot=0){ g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI*2); }
function stitchStroke(g, color, s, w=1){ g.save(); g.setLineDash([s*.11, s*.08]); g.lineWidth = Math.max(.8, s*.045*w); g.strokeStyle = color; g.stroke(); g.restore(); }
function button(g, x, y, r){
  g.fillStyle = '#0d0b0a'; ell(g, x, y, r, r); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; ell(g, x - r*.35, y - r*.35, r*.32, r*.32); g.fill();
}
function bunny(g, cx, cy, s, L){
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const ear = side => {
    g.save();
    if (L.ears === 'up'){ g.translate(cx + side*.42*s, cy - 1.05*s); g.rotate(side*.2); }
    else { g.translate(cx + side*.98*s, cy + .02*s); g.rotate(-side*.38); }
    g.fillStyle = L.fur; ell(g, 0, 0, .3*s, .84*s); g.fill(); stitchStroke(g, L.dark, s);
    g.fillStyle = '#e8a6a6'; ell(g, 0, L.ears==='up' ? -.04*s : .06*s, .15*s, .6*s); g.fill();
    g.restore();
  };
  ear(-1); ear(1);
  const gr = g.createRadialGradient(cx - .3*s, cy - .45*s, s*.1, cx, cy, s*1.15);
  gr.addColorStop(0, L.light); gr.addColorStop(1, L.fur);
  g.fillStyle = gr; ell(g, cx, cy, s, .92*s); g.fill(); stitchStroke(g, L.dark, s);
  g.beginPath(); g.moveTo(cx, cy - .9*s); g.lineTo(cx, cy - .4*s); stitchStroke(g, L.dark, s, .8);
  g.fillStyle = L.light; ell(g, cx, cy + .33*s, .42*s, .28*s); g.fill();
  button(g, cx - .4*s, cy - .06*s, .14*s); button(g, cx + .4*s, cy - .06*s, .14*s);
  g.fillStyle = '#e48c96'; g.beginPath(); g.moveTo(cx - .11*s, cy + .17*s); g.lineTo(cx + .11*s, cy + .17*s); g.lineTo(cx, cy + .3*s); g.closePath(); g.fill();
  g.strokeStyle = L.dark; g.lineWidth = Math.max(.8, s*.04); g.beginPath();
  g.moveTo(cx, cy + .3*s); g.lineTo(cx, cy + .38*s); g.moveTo(cx - .12*s, cy + .42*s); g.quadraticCurveTo(cx - .05*s, cy + .46*s, cx, cy + .38*s);
  g.quadraticCurveTo(cx + .05*s, cy + .46*s, cx + .12*s, cy + .42*s); g.stroke();
  if (L.scarf){
    g.fillStyle = L.scarf; g.beginPath();
    g.moveTo(cx - .86*s, cy + .58*s); g.quadraticCurveTo(cx, cy + 1.0*s, cx + .86*s, cy + .58*s);
    g.lineTo(cx + .8*s, cy + .86*s); g.quadraticCurveTo(cx, cy + 1.28*s, cx - .8*s, cy + .86*s); g.closePath(); g.fill();
    g.fillRect(cx + .38*s, cy + .85*s, .24*s, .38*s);
    g.beginPath(); g.moveTo(cx - .78*s, cy + .73*s); g.quadraticCurveTo(cx, cy + 1.13*s, cx + .78*s, cy + .73*s); stitchStroke(g, 'rgba(239,227,200,.75)', s, .8);
  }
  if (L.gear === 'fist' || L.gear === 'heart'){
    const bx = cx - .38*s, by = cy + .86*s;
    if (L.gear === 'fist'){
      const bg = g.createRadialGradient(bx - .05*s, by - .05*s, 1, bx, by, .2*s); bg.addColorStop(0, '#f3d27d'); bg.addColorStop(1, '#9c6d22');
      g.fillStyle = bg; ell(g, bx, by, .19*s, .19*s); g.fill(); g.fillStyle = '#5a3a10'; g.fillRect(bx - .08*s, by - .07*s, .16*s, .14*s);
    } else {
      g.fillStyle = '#f2b8c2'; g.beginPath(); g.moveTo(bx, by + .14*s);
      g.bezierCurveTo(bx - .26*s, by - .04*s, bx - .1*s, by - .22*s, bx, by - .07*s); g.bezierCurveTo(bx + .1*s, by - .22*s, bx + .26*s, by - .04*s, bx, by + .14*s); g.fill();
    }
  }
  if (L.gear === 'helm'){
    const hg = g.createLinearGradient(cx, cy - s, cx, cy - .2*s); hg.addColorStop(0, '#d6dbe2'); hg.addColorStop(1, '#7c838e');
    g.fillStyle = hg; g.beginPath(); g.ellipse(cx, cy - .26*s, s*1.04, s*.78, 0, Math.PI, 0); g.closePath(); g.fill();
    g.fillStyle = '#5d636d'; g.fillRect(cx - 1.04*s, cy - .34*s, 2.08*s, .14*s);
    g.fillStyle = '#e8ecf0'; for (const k of [-.7,-.35,0,.35,.7]){ ell(g, cx + k*s, cy - .27*s, .045*s, .045*s); g.fill(); }
    g.strokeStyle = '#b5302a'; g.lineWidth = s*.1; g.beginPath(); g.moveTo(cx, cy - 1.0*s); g.quadraticCurveTo(cx + .2*s, cy - 1.35*s, cx + .55*s, cy - 1.3*s); g.stroke();

    g.lineWidth = s*.03; g.beginPath(); g.moveTo(cx + .62*s, cy + .05*s); g.quadraticCurveTo(cx + .8*s, cy + .5*s, cx + .6*s, cy + .75*s); g.stroke();
  }
  if (L.gear === 'bandana'){

    g.beginPath(); g.ellipse(cx, cy - .05*s, s*.98, s*.62, 0, Math.PI*1.12, Math.PI*1.88); g.stroke();
    g.lineWidth = s*.12; g.beginPath(); g.moveTo(cx - .85*s, cy - .38*s); g.lineTo(cx - 1.2*s, cy - .2*s); g.moveTo(cx - .85*s, cy - .38*s); g.lineTo(cx - 1.15*s, cy - .55*s); g.stroke();
  }
  if (L.gear === 'shoe'){
    g.strokeStyle = '#c9973f'; g.lineWidth = s*.1; g.beginPath(); g.arc(cx + .45*s, cy + .9*s, .17*s, Math.PI*.1, Math.PI*.9, true); g.stroke();
  }
  g.restore();
}
function frog(g, cx, cy, s, L){
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const by = cy + .15*s;
  const gr = g.createRadialGradient(cx - .3*s, by - .4*s, s*.1, cx, by, s*1.3);
  gr.addColorStop(0, L.light); gr.addColorStop(1, L.skin);

  g.fillStyle = gr; ell(g, cx, by, 1.12*s, .78*s); g.fill(); stitchStroke(g, L.dark, s);
  for (const side of [-1,1]){
    g.fillStyle = L.skin; ell(g, cx + side*.52*s, cy - .45*s, .33*s, .33*s); g.fill();
    g.fillStyle = '#f4f0dd'; ell(g, cx + side*.52*s, cy - .45*s, .25*s, .25*s); g.fill();
    button(g, cx + side*.48*s, cy - .42*s, .13*s);
  }

    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(1, T*.035); ctx.setLineDash([T*.08, T*.06]); ctx.strokeRect(X + T*.09, Y + T*.09, T*.82, T*.82); ctx.setLineDash([]); }
  }
}
function brackets(x, y, col){
  const X = x*T, Y = y*T, l = T*.26, i = T*.04;
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, T*.06); ctx.lineCap = 'round';
  for (const [sx,sy] of [[0,0],[1,0],[0,1],[1,1]]){
    const cx = X + (sx ? T - i : i), cy = Y + (sy ? T - i : i), dx = sx ? -1 : 1, dy = sy ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(cx + dx*l, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + dy*l); ctx.stroke();
  }
}
function tornBand(y, h, w, col, seed){
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, y);
  for (let x=0; x<=w; x+=8) ctx.lineTo(x, y + (hash(x, seed) - .5)*7);
  for (let x=w; x>=0; x-=8) ctx.lineTo(x, y + h + (hash(x, seed+3) - .5)*7);
  ctx.closePath(); ctx.fill();
}
function render(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0, 0, COLS*T, ROWS*T);
  let sx = 0, sy = 0;
  if (shake > 0){ sx = (Math.random()-.5)*T*.15*shake; sy = (Math.random()-.5)*T*.15*shake; shake = Math.max(0, shake - .06); }
  ctx.translate(sx, sy);
  ctx.drawImage(terrCv, 0, 0, COLS*T, ROWS*T);
  if (showDanger) fillKeys(dangerKeys, 'rgba(255,128,32,.26)');
  if (inspect && !inspect.dead){
    const m = inspect.ai === 'hold' ? [K(inspect.x,inspect.y)] : destinations(inspect, reach(inspect));
    fillKeys([...rangeTiles(m, inspect.rng)].filter(k => !m.includes(k)), 'rgba(205,40,30,.36)', 'rgba(255,170,150,.55)');
    fillKeys(m, 'rgba(225,110,60,.3)');
  }
  fillKeys(moveKeys, 'rgba(70,130,255,.4)', 'rgba(200,222,255,.85)');
  fillKeys(atkKeys, mode === 'selected' ? 'rgba(215,45,35,.32)' : 'rgba(215,45,35,.24)', mode === 'selected' ? null : 'rgba(255,170,150,.5)');
  fillKeys(healKeys, 'rgba(70,210,120,.26)', mode === 'selected' ? null : 'rgba(190,255,200,.6)');
  if (mode === 'target'){
    const p = .5 + .25*Math.sin(now/160);
    for (const t of targets){ ctx.fillStyle = tmode === 'attack' ? `rgba(230,50,40,${p})` : `rgba(80,230,120,${p})`; ctx.fillRect(t.x*T + 1, t.y*T + 1, T - 2, T - 2); }
    if (fc) brackets(fc.x, fc.y, '#fff');
  }
  if (cursor && phase === 'p' && !busy && mode !== 'target') brackets(cursor.x, cursor.y, 'rgba(236,198,115,.95)');
  for (const u of units.filter(u => !u.dead).sort((a,b) => a.py - b.py)) drawUnit(u, now);
  for (const s of shots){
    const x = (s.x0 + (s.x1-s.x0)*s.t)*T, y = (s.y0 + (s.y1-s.y0)*s.t)*T - Math.sin(s.t*Math.PI)*T*.4, a = Math.atan2(s.y1-s.y0, s.x1-s.x0);
    ctx.strokeStyle = '#f3ead2'; ctx.lineWidth = Math.max(1.5, T*.04);
    ctx.beginPath(); ctx.moveTo(x - Math.cos(a)*T*.28, y - Math.sin(a)*T*.28); ctx.lineTo(x, y); ctx.stroke();
  }
  popups = popups.filter(p => now - p.t0 < p.dur);
  for (const p of popups){
    const t = (now - p.t0)/p.dur, y = (p.y - t*.55)*T;
    ctx.globalAlpha = 1 - t*t; ctx.font = `${Math.round(T*.44)}px 'Saira Stencil One', Impact, sans-serif`; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,6,4,.9)'; ctx.strokeText(p.text, p.x*T, y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x*T, y); ctx.globalAlpha = 1;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (banner){
    const W = COLS*T, t = (now - banner.t0)/banner.dur, a = t < .15 ? t/.15 : t > .82 ? Math.max(0,(1-t)/.18) : 1;
    const h = T*1.9, y = ROWS*T/2 - h/2, slide = (1 - a)*W*.15*(t < .5 ? -1 : 1);
    ctx.globalAlpha = a*.55; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, ROWS*T);
    ctx.globalAlpha = a; ctx.save(); ctx.translate(slide, 0);
    tornBand(y, h, W, banner.side === 'p' ? '#a8281f' : '#2c4419', banner.side === 'p' ? 3 : 7);
    ctx.save(); ctx.setLineDash([T*.12, T*.08]); ctx.lineWidth = 1.5; ctx.strokeStyle = banner.side === 'p' ? 'rgba(239,227,200,.7)' : 'rgba(215,235,160,.6)';
    ctx.beginPath(); ctx.moveTo(0, y + T*.18); ctx.lineTo(W, y + T*.18); ctx.moveTo(0, y + h - T*.18); ctx.lineTo(W, y + h - T*.18); ctx.stroke(); ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fs = Math.min(T*.62, W/13);
    ctx.font = `${Math.round(fs)}px 'Saira Stencil One', Impact, sans-serif`;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(banner.text, W/2 + 2, y + h*.42 + 3);
    ctx.fillStyle = banner.side === 'p' ? '#f3e7cb' : '#dbeeaa'; ctx.fillText(banner.text, W/2, y + h*.42);
    ctx.font = `italic ${Math.round(T*.32)}px 'IM Fell English', Georgia, serif`; ctx.fillStyle = banner.side === 'p' ? '#f0c98a' : '#b9d27a';
    ctx.fillText(banner.sub, W/2, y + h*.74);
    ctx.restore(); ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
  }
}
function frame(now){
  for (const tw of tweens.slice()){
    const t = Math.min(1, (now - tw.t0)/tw.dur); tw.fn(ease(t));
    if (t >= 1){ tweens.splice(tweens.indexOf(tw), 1); tw.res(); }
  }
  if (!tweens.length) for (const u of units) u.shp = u.hp;
  render(now);
  requestAnimationFrame(frame);
}

// ================= Input & boot =================
cvs.addEventListener('click', e => {
  const r = cvs.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left)/T), y = Math.floor((e.clientY - r.top)/T);
  if (x>=0 && y>=0 && x<COLS && y<ROWS) onTap(x, y);
});
$('#endBtn').addEventListener('click', () => {
  if (busy || phase !== 'p' || !(mode === 'idle' || mode === 'selected')) return;
  clearSel(); inspect = null; mode = 'idle'; enemyPhase();
});
$('#dangerBtn').addEventListener('click', () => { showDanger = !showDanger; updateDanger(); refreshTop(); });
$('#startBtn').addEventListener('click', async () => {
  $('#title').hidden = true; mode = 'busy';
  await talk(PROLOGUE);
  startPlayerPhase();
});
new ResizeObserver(resize).observe(boardEl);
document.fonts?.ready?.then(() => resize());

function start(data){
  newBattle();
  if (data && Array.isArray(data.units) && data.units.length && data.units[0].key){
    units = data.units.map(u => Object.assign(u, {px:u.x, py:u.y, ox:0, oy:0, flash:0, alpha:u.dead?0:1, shp:u.hp}));
    turn = data.turn || 1; bossTalked = !!data.bossTalked; phase = 'p'; mode = 'idle'; busy = false;
    if (data.phase !== 'p') for (const u of units) if (u.team === 'p') u.moved = false;
    $('#title').hidden = true; panelIdle();
  } else setPanel(`<div class="hint"><em>The banner waits.</em></div>`);
  resize(); refreshTop(); requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => (mode === 'title' || mode === 'over') ? {} : {
  units: units.map(u => ({...u, ox:0, oy:0, flash:0})), turn, phase, bossTalked,
});
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
