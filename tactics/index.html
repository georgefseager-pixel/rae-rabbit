#title{background:

.tpor{position:absolute}

#duel{position:absolute;inset:-6px;z-index:10;border-radius:12px;overflow:hidden;
  background:radial-gradient(ellipse 80% 45% at 50% 40%, rgba(130,26,20,.55), transparent 70%), radial-gradient(ellipse at 50% 50%, rgba(30,10,8,.92), rgba(6,4,4,.97));

/* ================= Campaign screens ================= */

/* faction switch */

.pin.next{color:var(--cream);box-shadow:0 0 0 2px var(--brass-hi), 0 0 0 6px rgba(236,198,115,.18)}
.f-rae .pin.next{background:var(--red)} .f-frog .pin.next{background:#3f6a28}
.pin.gate{background:#3a2a10;color:var(--brass-hi);box-shadow:0 0 0 2px var(--brass), 0 0 0 5px rgba(201,151,63,.2)}
.pin.future,.pin.stub{opacity:.5}
.ncard{background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;
  outline:1px dashed rgba(239,227,200,.18);outline-offset:-4px;min-width:0}
.f-frog .ncard{background:linear-gradient(180deg,#2c3e1e,#1a260f)}
.ncard.dim{opacity:.55}
.ncard h3{font-family:var(--fell);font-size:19px;margin:0;line-height:1.1}
.ncard .nmeta{font-size:13px;color:var(--muted);line-height:1.4}
.ncard .nmeta b{color:var(--cream);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.3);color:var(--muted)}
.chip.conv{background:#5a4318;color:var(--brass-hi)}
.chip.ok{background:rgba(111,191,106,.18);color:#9fe09a}
.chip.bonus{background:rgba(236,198,115,.15);color:var(--brass-hi)}
.gatebox{border-radius:8px;padding:8px 10px;background:rgba(201,151,63,.1);outline:1px dashed rgba(201,151,63,.5);outline-offset:-3px;font-size:13px;line-height:1.4;color:#e8d8b4;
  display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ncard .btn{align-self:flex-start;min-height:40px;font-size:13px}

/* army */
.tabs{display:flex;gap:6px}
.tabs .btn{flex:1;min-height:40px;font-size:13px}
.tabs .btn.on{background:var(--navy3);outline-color:var(--brass-hi)}
.ulist{display:flex;flex-direction:column;gap:10px}
.ucard{display:grid;grid-template-columns:70px 1fr;gap:12px;background:linear-gradient(180deg,var(--navy2),var(--navy));border-radius:10px;padding:10px;
  outline:1px dashed rgba(239,227,200,.18);outline-offset:-4px;min-width:0}
.f-frog .ucard{background:linear-gradient(180deg,#2c3e1e,#1a260f)}
.ucard.dead{filter:grayscale(1);opacity:.5}
.ucard.pick{cursor:pointer}
.ucard.pick.on{outline:2px solid var(--brass-hi);outline-offset:-2px;box-shadow:0 0 0 3px rgba(236,198,115,.2)}
.ucard .stats{grid-column:1/-1}
.ustat{font-size:13px;color:var(--muted)}
.ustat b{color:var(--cream);font-weight:500}
.uacts{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.uacts .btn{min-height:38px;font-size:12px;padding:8px 10px;flex:1}
.xp{height:5px;background:#0b0d16;border-radius:3px;overflow:hidden;margin-top:2px}
.xp i{display:block;height:100%;background:var(--brass)}
.tick{font-family:var(--stencil);font-size:12px;letter-spacing:.06em;color:var(--brass-hi)}
.empty{font-family:var(--fell-i);font-style:italic;color:var(--muted);font-size:16px;text-align:center;padding:20px 0}

/* prep + results */
.brief{background:linear-gradient(180deg,#2a1915,#170e0c);border-radius:12px;padding:14px;outline:1px dashed var(--thread);outline-offset:-6px;display:flex;flex-direction:column;gap:8px}
.brief h2{font-family:var(--fell);font-size:24px;margin:0;line-height:1.1}
.brief .kick{font-family:var(--fell);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-hi)}
.brief p{margin:0;font-size:15px;line-height:1.45;color:#dccfb4}
.sticky{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(180deg,transparent,var(--bg) 35%);display:flex;gap:8px}
.sticky .btn{flex:1;min-height:50px}
.rlist{display:flex;flex-direction:column;gap:6px;font-size:15px}
.rlist div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:rgba(0,0,0,.25);border-radius:6px}
.rlist b{font-family:var(--fell);font-weight:400;color:var(--brass-hi)}

#toast{position:fixed;left:50%;bottom:max(24px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:40;background:#2a1915;color:var(--cream);
  padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);outline:1px dashed var(--thread);outline-offset:-4px;max-width:86vw;text-align:center}
#menu .card .btn{width:100%}

const ROMAN = n => { let s = ''; for (const [v, c] of [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]) while (n >= v){ s += c; n -= v; } return s; };
function hash(x, y, s = 0){ let h = (x*374761393 + y*668265263 + s*1442695041) | 0; h = Math.imul(h ^ (h>>>13), 1274126177); return ((h ^ (h>>>16)) >>> 0) / 4294967295; }

// Per-viewer save slot. Browser storage can be missing or throw (private windows,
// previews), so every access is guarded and the game still runs without it.
const Store = {
  key: 'raepublic-save-v1',
  load(){ try { const s = localStorage.getItem(this.key); return s ? JSON.parse(s) : null; } catch (e){ return null; } },
  save(d){ try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e){} },
  clear(){ try { localStorage.removeItem(this.key); } catch (e){} },
};

// Character art arrives as data URIs (see tools/build.py). Turn each into a short blob: URL
// once, so the page never copies the big strings around when it re-renders.
function dataToURL(d){
  try {
    const [head, b64] = d.split(','), bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], {type: head.slice(5).split(';')[0]}));
  } catch (e){ return d; }
}
const ART = {};   // ART[characterKey] = {portrait, battle}
for (const [key, set] of Object.entries(window.GAME_ART || {})){
  ART[key] = {};
  for (const [kind, d] of Object.entries(set)) ART[key][kind] = dataToURL(d);
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.tm); toast.tm = setTimeout(() => { t.hidden = true; }, 2200);
}

// Two-tap confirmation for destructive buttons (the viewer has no confirm() dialog).
function armed(btn, label){
  if (btn.dataset.armed){ delete btn.dataset.armed; return true; }
  const orig = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label;
  setTimeout(() => { if (btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = orig; } }, 2500);
  return false;
}

// ---------------- 05-anim.js ----------------
// Animation core: promise-based tweens driven by the single frame loop in 45-render.js.
let tweens = [], speed = 1;
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
const tween = (dur, fn) => new Promise(res => tweens.push({t0: performance.now(), dur: dur/speed, fn, res}));
const wait = ms => tween(ms, () => {});
const anim = (el, kf, dur, opt = {}) => el.animate(kf, Object.assign({duration: dur/speed, easing: 'ease-out', fill: 'none'}, opt)).finished.catch(() => {});
function stepTweens(now){
  for (const tw of tweens.slice()){
    const t = Math.min(1, (now - tw.t0)/tw.dur); tw.fn(ease(t));
    if (t >= 1){ tweens.splice(tweens.indexOf(tw), 1); tw.res(); }
  }
}

// ================= Plush drawing =================
// Placeholder characters drawn in code: felt shapes, button eyes, running stitches.
function ell(g, x, y, rx, ry, rot = 0){ g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI*2); }
function stitchStroke(g, color, s, w = 1){ g.save(); g.setLineDash([s*.11, s*.08]); g.lineWidth = Math.max(.8, s*.045*w); g.strokeStyle = color; g.stroke(); g.restore(); }
function button(g, x, y, r, col = '#0d0b0a'){
  g.fillStyle = col; ell(g, x, y, r, r); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; ell(g, x - r*.35, y - r*.35, r*.32, r*.32); g.fill();
}
function bandana(g, cx, cy, s, col, rx, ry, tailSide = -1){
  g.strokeStyle = col; g.lineWidth = s*.2;
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, Math.PI*1.12, Math.PI*1.88); g.stroke();
  const kx = cx + tailSide*rx*.86, ky = cy - ry*.55;
  g.lineWidth = s*.12; g.beginPath(); g.moveTo(kx, ky); g.lineTo(kx + tailSide*.35*s, ky + .18*s); g.moveTo(kx, ky); g.lineTo(kx + tailSide*.3*s, ky - .17*s); g.stroke();
}

function bunny(g, cx, cy, s, L){
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const ear = side => {
    g.save();
    if (L.ears === 'up'){ g.translate(cx + side*.42*s, cy - 1.05*s); g.rotate(side*.2); }
    else { g.translate(cx + side*.98*s, cy + .02*s); g.rotate(-side*.38); }
    g.fillStyle = L.fur; ell(g, 0, 0, .3*s, .84*s); g.fill(); stitchStroke(g, L.dark, s);
    g.fillStyle = '#e8a6a6'; ell(g, 0, L.ears === 'up' ? -.04*s : .06*s, .15*s, .6*s); g.fill();
    g.restore();
  };
  ear(-1); ear(1);
  const gr = g.createRadialGradient(cx - .3*s, cy - .45*s, s*.1, cx, cy, s*1.15);
  gr.addColorStop(0, L.light); gr.addColorStop(1, L.fur);
  g.fillStyle = gr; ell(g, cx, cy, s, .92*s); g.fill(); stitchStroke(g, L.dark, s);
  g.beginPath(); g.moveTo(cx, cy - .9*s); g.lineTo(cx, cy - .4*s); stitchStroke(g, L.dark, s, .8);
  g.fillStyle = L.light; ell(g, cx, cy + .33*s, .42*s, .28*s); g.fill();
  button(g, cx - .4*s, cy - .06*s, .14*s); button(g, cx + .4*s, cy - .06*s, .14*s);
  g.fillStyle = '#e48c96'; g.beginPath(); g.moveTo(cx - .11*s, cy + .17*s); g.lineTo(cx + .11*s, cy + .17*s); g.lineTo(cx, cy + .3*s); g.closePath(); g.fill();
  g.strokeStyle = L.dark; g.lineWidth = Math.max(.8, s*.04); g.beginPath();
  g.moveTo(cx, cy + .3*s); g.lineTo(cx, cy + .38*s); g.moveTo(cx - .12*s, cy + .42*s); g.quadraticCurveTo(cx - .05*s, cy + .46*s, cx, cy + .38*s);
  g.quadraticCurveTo(cx + .05*s, cy + .46*s, cx + .12*s, cy + .42*s); g.stroke();
  if (L.scarf){
    g.fillStyle = L.scarf; g.beginPath();
    g.moveTo(cx - .86*s, cy + .58*s); g.quadraticCurveTo(cx, cy + 1.0*s, cx + .86*s, cy + .58*s);
    g.lineTo(cx + .8*s, cy + .86*s); g.quadraticCurveTo(cx, cy + 1.28*s, cx - .8*s, cy + .86*s); g.closePath(); g.fill();
    g.fillRect(cx + .38*s, cy + .85*s, .24*s, .38*s);
    g.beginPath(); g.moveTo(cx - .78*s, cy + .73*s); g.quadraticCurveTo(cx, cy + 1.13*s, cx + .78*s, cy + .73*s); stitchStroke(g, 'rgba(239,227,200,.75)', s, .8);
  }
  const bx = cx - .38*s, by = cy + .86*s;
  if (L.gear === 'fist'){
    const bg = g.createRadialGradient(bx - .05*s, by - .05*s, 1, bx, by, .2*s); bg.addColorStop(0, '#f3d27d'); bg.addColorStop(1, '#9c6d22');
    g.fillStyle = bg; ell(g, bx, by, .19*s, .19*s); g.fill(); g.fillStyle = '#5a3a10'; g.fillRect(bx - .08*s, by - .07*s, .16*s, .14*s);
  }
  if (L.gear === 'heart'){
    g.fillStyle = '#f2b8c2'; g.beginPath(); g.moveTo(bx, by + .14*s);
    g.bezierCurveTo(bx - .26*s, by - .04*s, bx - .1*s, by - .22*s, bx, by - .07*s); g.bezierCurveTo(bx + .1*s, by - .22*s, bx + .26*s, by - .04*s, bx, by + .14*s); g.fill();
  }
  if (L.gear === 'helm'){
    const hg = g.createLinearGradient(cx, cy - s, cx, cy - .2*s); hg.addColorStop(0, '#d6dbe2'); hg.addColorStop(1, '#7c838e');
    g.fillStyle = hg; g.beginPath(); g.ellipse(cx, cy - .26*s, s*1.04, s*.78, 0, Math.PI, 0); g.closePath(); g.fill();
    g.fillStyle = '#5d636d'; g.fillRect(cx - 1.04*s, cy - .34*s, 2.08*s, .14*s);
    g.fillStyle = '#e8ecf0'; for (const k of [-.7,-.35,0,.35,.7]){ ell(g, cx + k*s, cy - .27*s, .045*s, .045*s); g.fill(); }
    g.strokeStyle = '#b5302a'; g.lineWidth = s*.1; g.beginPath(); g.moveTo(cx, cy - 1.0*s); g.quadraticCurveTo(cx + .2*s, cy - 1.35*s, cx + .55*s, cy - 1.3*s); g.stroke();
  }
  if (L.gear === 'monocle'){
    g.strokeStyle = '#e2b955'; g.lineWidth = s*.07; ell(g, cx + .4*s, cy - .06*s, .25*s, .25*s); g.stroke();
    g.lineWidth = s*.03; g.beginPath(); g.moveTo(cx + .62*s, cy + .05*s); g.quadraticCurveTo(cx + .8*s, cy + .5*s, cx + .6*s, cy + .75*s); g.stroke();
  }
  if (L.gear === 'bandana') bandana(g, cx, cy - .05*s, s, L.band || '#3b2a6b', s*.98, s*.62);
  if (L.gear === 'shoe'){ g.strokeStyle = '#c9973f'; g.lineWidth = s*.1; g.beginPath(); g.arc(cx + .45*s, cy + .9*s, .17*s, Math.PI*.1, Math.PI*.9, true); g.stroke(); }
  g.restore();
}

function frog(g, cx, cy, s, L){
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  const by = cy + .15*s;
  if (L.gear === 'hood'){   // drawn behind the body
    g.fillStyle = '#3e2a52'; g.beginPath(); g.ellipse(cx, cy - .05*s, 1.3*s, 1.15*s, 0, Math.PI*.92, Math.PI*2.08); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(cx, cy - .05*s, 1.3*s, 1.15*s, 0, Math.PI*.92, Math.PI*2.08); stitchStroke(g, '#c9a8e0', s, .7);
  }
  const gr = g.createRadialGradient(cx - .3*s, by - .4*s, s*.1, cx, by, s*1.3);
  gr.addColorStop(0, L.light); gr.addColorStop(1, L.skin);
  for (const side of [-1,1]){ g.fillStyle = L.skin; ell(g, cx + side*.52*s, cy - .45*s, .37*s, .37*s); g.fill(); stitchStroke(g, L.dark, s); }
  g.fillStyle = gr; ell(g, cx, by, 1.12*s, .78*s); g.fill(); stitchStroke(g, L.dark, s);
  for (const side of [-1,1]){
    g.fillStyle = L.skin; ell(g, cx + side*.52*s, cy - .45*s, .33*s, .33*s); g.fill();
    g.fillStyle = '#f4f0dd'; ell(g, cx + side*.52*s, cy - .45*s, .25*s, .25*s); g.fill();
    button(g, cx + side*.48*s, cy - .42*s, .13*s, L.eye);
  }
  g.fillStyle = L.belly; ell(g, cx, by + .3*s, .66*s, .36*s); g.fill(); g.beginPath(); g.ellipse(cx, by + .3*s, .66*s, .36*s, 0, 0, Math.PI*2); stitchStroke(g, L.dark, s, .7);
  g.strokeStyle = L.dark; g.lineWidth = s*.06; g.beginPath(); g.moveTo(cx - .62*s, cy + .02*s); g.quadraticCurveTo(cx, cy + .38*s, cx + .62*s, cy + .02*s); g.stroke();
  g.fillStyle = 'rgba(232,120,130,.45)'; ell(g, cx - .75*s, cy + .12*s, .14*s, .09*s); g.fill(); ell(g, cx + .75*s, cy + .12*s, .14*s, .09*s); g.fill();
  switch (L.gear){
    case 'collar':
      g.fillStyle = '#3b3631'; g.fillRect(cx - .8*s, by + .5*s, 1.6*s, .16*s);
      g.fillStyle = '#9a948c'; for (let i = 0; i < 5; i++){ const x = cx - .64*s + i*.32*s; g.beginPath(); g.moveTo(x - .08*s, by + .5*s); g.lineTo(x, by + .34*s); g.lineTo(x + .08*s, by + .5*s); g.fill(); }
      g.strokeStyle = '#e9d9b0'; g.lineWidth = s*.04; g.beginPath(); g.moveTo(cx + .3*s, cy - .72*s); g.lineTo(cx + .7*s, cy - .2*s); g.moveTo(cx + .4*s, cy - .4*s); g.lineTo(cx + .6*s, cy - .52*s); g.stroke();
      break;
    case 'lilypad':
      g.fillStyle = '#3e7a3b'; g.beginPath(); g.ellipse(cx, cy - .78*s, .62*s, .2*s, -.08, .25, Math.PI*2 - .1); g.lineTo(cx, cy - .78*s); g.closePath(); g.fill();
      g.beginPath(); g.ellipse(cx, cy - .78*s, .62*s, .2*s, -.08, 0, Math.PI*2); stitchStroke(g, '#203f1e', s, .7);
      g.fillStyle = '#f2a3c0'; for (const [a, b] of [[-.1,-.95],[.06,-.97],[-.02,-1.06]]){ ell(g, cx + a*s, cy + b*s, .1*s, .1*s); g.fill(); }
      g.fillStyle = '#f7e27a'; ell(g, cx - .02*s, cy - .97*s, .05*s, .05*s); g.fill();
      break;
    case 'reed':
      g.strokeStyle = '#4a3a22'; g.lineWidth = s*.12; g.beginPath(); g.ellipse(cx, cy + .02*s, s*1.02, s*.55, 0, Math.PI*1.08, Math.PI*1.92); g.stroke();
      g.strokeStyle = '#6b8a3a'; g.lineWidth = s*.06; g.beginPath(); g.moveTo(cx - .45*s, cy - .5*s); g.quadraticCurveTo(cx - .55*s, cy - 1.0*s, cx - .35*s, cy - 1.45*s); g.stroke();
      g.fillStyle = '#6b4a2a'; ell(g, cx - .38*s, cy - 1.3*s, .08*s, .2*s, .2); g.fill();
      break;
    case 'bandana':
      bandana(g, cx, by, s, L.band || '#c0392b', s*1.1, s*.62, 1);
      break;
    case 'eyepatch':
      bandana(g, cx, by, s, '#c0392b', s*1.1, s*.62, 1);
      g.fillStyle = '#111'; ell(g, cx - .52*s, cy - .45*s, .27*s, .27*s); g.fill();
      g.strokeStyle = '#111'; g.lineWidth = s*.04; g.beginPath(); g.moveTo(cx - .82*s, cy - .62*s); g.lineTo(cx - .2*s, cy - .62*s); g.stroke();
      break;
    case 'crown': {
      g.fillStyle = '#5b2a6b'; g.beginPath(); g.moveTo(cx - 1.1*s, by + .45*s); g.quadraticCurveTo(cx, by + .95*s, cx + 1.1*s, by + .45*s);
      g.lineTo(cx + 1.0*s, by + .78*s); g.quadraticCurveTo(cx, by + 1.2*s, cx - 1.0*s, by + .78*s); g.closePath(); g.fill();
      g.strokeStyle = '#f4efe2'; g.lineWidth = s*.14; g.beginPath(); g.moveTo(cx - 1.06*s, by + .5*s); g.quadraticCurveTo(cx, by + 1.0*s, cx + 1.06*s, by + .5*s); g.stroke();
      g.fillStyle = '#111'; for (const k of [-.6,-.2,.2,.6]){ ell(g, cx + k*s, by + .72*s - Math.abs(k)*.18*s, .035*s, .05*s); g.fill(); }
      const cg = g.createLinearGradient(cx, cy - 1.3*s, cx, cy - .75*s); cg.addColorStop(0, '#f7dc8a'); cg.addColorStop(1, '#b07d22');
      g.fillStyle = cg; g.beginPath(); const yb = cy - .78*s;
      g.moveTo(cx - .36*s, yb); g.lineTo(cx - .4*s, yb - .38*s); g.lineTo(cx - .2*s, yb - .18*s); g.lineTo(cx, yb - .5*s); g.lineTo(cx + .2*s, yb - .18*s); g.lineTo(cx + .4*s, yb - .38*s); g.lineTo(cx + .36*s, yb); g.closePath(); g.fill();
      g.fillStyle = '#c0392b'; ell(g, cx, yb - .12*s, .06*s, .06*s); g.fill();
      break;

function mouse(g, cx, cy, s, L){
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  for (const side of [-1,1]){
    g.fillStyle = L.fur; ell(g, cx + side*.74*s, cy - .62*s, .5*s, .5*s); g.fill(); stitchStroke(g, L.dark, s);
    g.fillStyle = '#f1b5c0'; ell(g, cx + side*.74*s, cy - .6*s, .32*s, .32*s); g.fill();
  }
  const gr = g.createRadialGradient(cx - .3*s, cy - .4*s, s*.1, cx, cy, s*1.1);
  gr.addColorStop(0, L.light); gr.addColorStop(1, L.fur);
  g.fillStyle = gr; g.beginPath(); g.moveTo(cx - .92*s, cy - .1*s);
  g.bezierCurveTo(cx - .95*s, cy - .9*s, cx + .95*s, cy - .9*s, cx + .92*s, cy - .1*s);
  g.bezierCurveTo(cx + .85*s, cy + .5*s, cx + .3*s, cy + .82*s, cx, cy + .86*s);
  g.bezierCurveTo(cx - .3*s, cy + .82*s, cx - .85*s, cy + .5*s, cx - .92*s, cy - .1*s); g.fill(); stitchStroke(g, L.dark, s);
  button(g, cx - .36*s, cy - .08*s, .13*s); button(g, cx + .36*s, cy - .08*s, .13*s);
  g.fillStyle = '#e88a9a'; ell(g, cx, cy + .32*s, .11*s, .09*s); g.fill();
  g.strokeStyle = L.dark; g.lineWidth = Math.max(.7, s*.03);
  for (const side of [-1,1]) for (const dy of [-.06, .08]){ g.beginPath(); g.moveTo(cx + side*.22*s, cy + .36*s); g.lineTo(cx + side*.95*s, cy + .3*s + dy*s*2); g.stroke(); }
  if (L.scarf){
    g.fillStyle = L.scarf; g.beginPath(); g.moveTo(cx - .55*s, cy + .66*s); g.lineTo(cx + .55*s, cy + .66*s); g.lineTo(cx, cy + 1.08*s); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(cx - .4*s, cy + .74*s); g.lineTo(cx + .4*s, cy + .74*s); stitchStroke(g, 'rgba(240,230,210,.7)', s, .7);
  }
  if (L.gear === 'bandana') bandana(g, cx, cy - .05*s, s, L.band || '#8a5a2a', s*.9, s*.6);
  if (L.gear === 'thimble'){
    const tg = g.createLinearGradient(cx - .45*s, 0, cx + .45*s, 0); tg.addColorStop(0, '#8d939c'); tg.addColorStop(.45, '#e4e8ee'); tg.addColorStop(1, '#7a8089');
    g.fillStyle = tg; g.beginPath(); g.moveTo(cx - .46*s, cy - .52*s); g.lineTo(cx - .38*s, cy - 1.2*s); g.quadraticCurveTo(cx, cy - 1.36*s, cx + .38*s, cy - 1.2*s); g.lineTo(cx + .46*s, cy - .52*s); g.closePath(); g.fill();
    g.fillStyle = 'rgba(60,60,70,.45)'; for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++){ ell(g, cx - .27*s + i*.18*s, cy - 1.08*s + j*.17*s, .035*s, .035*s); g.fill(); }
    g.fillStyle = '#c0392b'; g.fillRect(cx - .5*s, cy - .6*s, s, .1*s);
  }
  g.restore();
}

function drawPlush(g, look, cx, cy, s){
  const L = LOOKS[look] || LOOKS.rebel;
  ({bun: bunny, frog, mouse})[L.sp](g, cx, cy, s, L);
}
const portraitCache = {};
function plushPortrait(look){
  if (portraitCache[look]) return portraitCache[look];
  const c = document.createElement('canvas'); c.width = 300; c.height = 360;
  const L = LOOKS[look] || LOOKS.rebel;
  drawPlush(c.getContext('2d'), look, 150, L.sp === 'bun' ? 175 : 200, L.sp === 'bun' ? 92 : 100);
  return portraitCache[look] = c.toDataURL();
}

// Weapon glyph for the brass badge on each token.
function glyph(g, w, cx, cy, r, col){
  g.save(); g.translate(cx, cy); g.strokeStyle = col; g.fillStyle = col;
  g.lineWidth = Math.max(1.2, r*.2); g.lineCap = 'round'; g.lineJoin = 'round';
  const L = (a, b, c, d) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); };
  if (w === 'sword'){ g.rotate(Math.PI/4); L(0,-.65*r,0,.2*r); L(-.3*r,.2*r,.3*r,.2*r); L(0,.2*r,0,.55*r); }
  if (w === 'lance'){ g.rotate(Math.PI/4); L(0,.65*r,0,-.3*r); g.beginPath(); g.moveTo(0,-.75*r); g.lineTo(-.18*r,-.28*r); g.lineTo(.18*r,-.28*r); g.closePath(); g.fill(); }
  if (w === 'axe'){ g.rotate(Math.PI/7); L(-.05*r,.65*r,-.05*r,-.6*r); g.beginPath(); g.arc(0,-.3*r,.38*r,-Math.PI/2,Math.PI/2); g.closePath(); g.fill(); }
  if (w === 'bow'){ g.beginPath(); g.arc(-.3*r,0,.62*r,-1.05,1.05); g.stroke(); const ex = -.3*r + .62*r*Math.cos(1.05), ey = .62*r*Math.sin(1.05); g.lineWidth *= .5; L(ex,-ey,ex,ey); g.lineWidth *= 2; L(-.15*r,0,.6*r,0); }
  if (w === 'staff'){ g.rotate(Math.PI/4); L(0,.68*r,0,-.45*r); g.lineWidth *= .6; g.beginPath(); g.ellipse(0,-.5*r,.1*r,.2*r,0,0,Math.PI*2); g.stroke(); g.beginPath(); g.moveTo(0,-.6*r); g.quadraticCurveTo(.6*r,-.4*r,.3*r,.1*r); g.stroke(); }
  g.restore();
}

// Portrait markup for panels, cards and dialogue. Uses real art when art/<key>-portrait.png exists.
function portraitInner(key, look, where = 'panel'){
  const art = ART[key]?.portrait, crop = CHARACTERS[key]?.crop?.[where];
  if (art) return `<div class="porart" style="background-image:url(${art});background-size:${crop ? crop[0] : '200% auto'};background-position:${crop ? crop[1] : '50% 0%'}"></div>`;
  return `<img alt="" src="${plushPortrait(look)}">`;
}

// ================= Save state & armies =================
// SAVE = {v, current:'rae'|'frog', flags:{}, camps:{rae:{cleared:[], res, roster:[records], recruited}, frog:{...}}}
// A roster record is a unit's permanent self: level, experience, stats, weapon tier, and whether it has fallen.
let SAVE = null;

function scaledStats(cls, lv, bonus){
  const c = CLASSES[cls], s = {...c.base};
  for (const k of STAT_KEYS) s[k] += Math.round((lv - 1)*c.g[k]/100);
  if (bonus) for (const k in bonus) s[k] = (s[k] || 0) + bonus[k];
  return s;
}
function recordFor(key){
  const c = CHARACTERS[key];
  return {uid: key, key, name: c.name, faction: c.faction, cls: c.cls, look: key, lv: c.lv, exp: 0, stats: {...c.stats},
          wtier: 0, wname: c.wname || CLASSES[c.cls].wname, lord: !!c.lord, dead: false};
}
function newSave(){
  return {v: 1, current: 'rae', flags: {}, camps: Object.fromEntries(Object.entries(CAMPAIGNS).map(([k, c]) =>
    [k, {cleared: [], res: c.startRes, roster: c.start.map(recordFor), recruited: 0}]))};
}
const saveGame = () => Store.save(SAVE);
const isCleared = id => Object.values(SAVE.camps).some(c => c.cleared.includes(id));
const growthOf = rec => CHARACTERS[rec.key]?.g || CLASSES[rec.cls].g;
const weaponName = rec => WEAPON_TIERS[rec.wtier || 0].prefix + rec.wname;
const living = campKey => SAVE.camps[campKey].roster.filter(r => !r.dead);

function findChapter(id){
  for (const [camp, c] of Object.entries(CAMPAIGNS)){
    const i = c.chapters.findIndex(ch => ch.id === id);
    if (i >= 0) return {camp, i, ch: c.chapters[i]};
  }
  return null;
}
// done | next | gate (waiting on the other story) | stub (not written yet) | future
function chapterState(campKey, i){
  const camp = CAMPAIGNS[campKey], ch = camp.chapters[i], st = SAVE.camps[campKey];
  if (st.cleared.includes(ch.id)) return {s: 'done'};
  if (i > 0 && !st.cleared.includes(camp.chapters[i - 1].id)) return {s: 'future'};
  if (ch.stub) return {s: 'stub'};
  const missing = (ch.requires || []).filter(r => !isCleared(r));
  return missing.length ? {s: 'gate', missing} : {s: 'next'};
}
function currentChapterIndex(campKey){
  const n = CAMPAIGNS[campKey].chapters.length;
  for (let i = 0; i < n; i++) if (chapterState(campKey, i).s !== 'done') return i;
  return n - 1;
}

function recruitOptions(campKey){
  return CAMPAIGNS[campKey].recruits.filter(r => !r.after || isCleared(r.after));
}
function recruitLevel(campKey){
  const lv = living(campKey).map(r => r.lv);
  return Math.max(1, Math.floor(lv.reduce((a, b) => a + b, 0)/lv.length) - 1);
}
function makeRecruit(campKey, cls){
  const st = SAVE.camps[campKey], faction = CAMPAIGNS[campKey].faction, used = new Set(st.roster.map(r => r.name));
  const name = RECRUIT_NAMES[faction].find(n => !used.has(n)) || `${CLASSES[cls].name} ${st.recruited + 1}`;
  const lv = recruitLevel(campKey);
  st.recruited++;
  return {uid: `${cls}-${Date.now().toString(36)}-${st.recruited}`, key: 'recruit', name, faction, cls, look: CLASS_LOOK[cls],
          lv, exp: 0, stats: scaledStats(cls, lv), wtier: 0, wname: CLASSES[cls].wname, lord: false, dead: false};
}

// Roll level-up gains for a record-shaped object ({lv, stats or flat stats}); guarantees at least one.
function rollLevel(statsObj, g){
  const ups = {};
  for (const s of STAT_KEYS) ups[s] = Math.random()*100 < g[s] ? 1 : 0;
  if (!STAT_KEYS.some(s => ups[s])) ups[STAT_KEYS[Math.floor(Math.random()*STAT_KEYS.length)]] = 1;
  for (const s of STAT_KEYS) statsObj[s] += ups[s];
  return ups;
}

// ================= Battle engine =================
// runBattle(campKey, chapter, deployedRecords) plays one chapter and resolves with
// {win, retreated, turn, survivors, lost}. Team 'p' is whoever the player controls
// (rabbits or frogs); team 'e' is the AI.
let B = null;   // {ch, campKey, pf, ef, kills, waves, resolve, done}
let MAP = [], COLS = 8, ROWS = 12;
let units = [], turn = 1, phase = 'p', mode = 'idle', busy = false, bossTalked = false, nextId = 1;
let sel = null, orig = null, reachMap = null, moveKeys = new Set(), atkKeys = new Set(), healKeys = new Set();
let targets = [], tmode = null, fc = null, inspect = null, showDanger = false, dangerKeys = new Set(), cursor = null;
let fortOwner = new Map();

const ter = (x, y) => TER[MAP[y][x]];
const K = (x, y) => y*COLS + x, KX = k => k % COLS, KY = k => Math.floor(k / COLS);
const man = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const team = t => units.filter(u => !u.dead && u.team === t);
const unitAt = (x, y) => units.find(u => !u.dead && u.x === x && u.y === y);
const inBounds = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const healAmt = u => 8 + Math.floor(u.atk/2);

function moveCost(u, x, y){
  const ch = MAP[y][x], c = TER[ch].cost;
  if (c >= 99) return 99;
  if (u.mt === 'mounted'){ if (ch === 'F') return 3; if (ch === 'M') return 99; }
  if (u.mt === 'armor' && ch === 'M') return 99;
  if (u.mt === 'bog' && ch === 'M') return 2;
  return c;
}

// ---------- Setup ----------
function battleUnit(rec, teamId){
  const c = CLASSES[rec.cls], s = rec.stats, tb = WEAPON_TIERS[rec.wtier || 0].bonus;
  return {id: nextId++, rec, team: teamId, faction: rec.faction, key: rec.key, look: rec.look, name: rec.name, cls: rec.cls,
    wname: weaponName(rec), tb, lv: rec.lv, exp: rec.exp || 0, hp: s.mhp, mhp: s.mhp, atk: s.atk + tb, def: s.def, spd: s.spd, skl: s.skl, mov: s.mov,
    w: c.w, rng: c.rng, mt: c.mt, ai: 'charge', lord: !!rec.lord, boss: false, g: growthOf(rec),
    moved: false, dead: false, x: 0, y: 0, px: 0, py: 0, ox: 0, oy: 0, flash: 0, alpha: 1, shp: s.mhp};
}
function enemyUnit(sp, faction){
  const rec = {key: sp.key || 'enemy', look: sp.look || CLASS_LOOK[sp.cls], name: sp.name || CLASSES[sp.cls].name, faction, cls: sp.cls,
               lv: sp.lv, stats: scaledStats(sp.cls, sp.lv, sp.bonus), wtier: 0, wname: CLASSES[sp.cls].wname};
  return Object.assign(battleUnit(rec, 'e'), {ai: sp.ai || 'charge', boss: !!sp.boss});
}
function place(u, x, y){ u.x = u.px = x; u.y = u.py = y; }
function freeTileNear(x, y){
  const seen = new Set([K(x, y)]), q = [[x, y]];
  while (q.length){
    const [cx, cy] = q.shift();
    if (TER[MAP[cy][cx]].cost < 99 && !unitAt(cx, cy)) return [cx, cy];
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cx + dx, ny = cy + dy;
      if (inBounds(nx, ny) && !seen.has(K(nx, ny))){ seen.add(K(nx, ny)); q.push([nx, ny]); }
    }
  }
  return [x, y];
}

function runBattle(campKey, ch, records){
  B = {ch, campKey, pf: CAMPAIGNS[campKey].faction, ef: ch.enemyFaction, kills: 0, done: false,
       waves: ch.reinforce ? ch.reinforce(SAVE.flags) : []};
  MAP = MAPS[ch.map]; ROWS = MAP.length; COLS = MAP[0].length;
  nextId = 1; units = [];
  records.forEach((r, i) => { const u = battleUnit(r, 'p'); place(u, ...ch.deploy[i]); units.push(u); });
  for (const sp of ch.enemies(SAVE.flags)){ const u = enemyUnit(sp, B.ef); place(u, ...freeTileNear(sp.x, sp.y)); units.push(u); }
  fortOwner = new Map();
  MAP.forEach((row, y) => [...row].forEach((c, x) => {
    if (c !== 'T') return;
    let best = null; for (const u of units){ const d = Math.abs(u.x - x) + Math.abs(u.y - y); if (!best || d < best.d) best = {d, f: u.faction}; }
    fortOwner.set(K(x, y), best ? best.f : B.pf);
  }));
  turn = 1; phase = 'p'; bossTalked = false; clearSel(); inspect = null; showDanger = false; cursor = null; updateDanger();
  $('#panel').className = 'f-' + B.pf;
  showScreen('app'); resize(); refreshTop();
  return new Promise(res => { B.resolve = res; startPlayerPhase(); });
}
function finishBattle(win, retreated = false){
  if (!B || B.done) return;
  B.done = true; busy = true; mode = 'over'; $('#duel').hidden = true;
  B.resolve({win, retreated, turn, survivors: units.filter(u => u.team === 'p' && !u.dead), lost: units.filter(u => u.team === 'p' && u.dead)});
}

// ---------- Movement & ranges ----------
function reach(u){
  const map = new Map([[K(u.x, u.y), {d: 0, prev: -1}]]), open = [K(u.x, u.y)];
  while (open.length){
    open.sort((a, b) => map.get(a).d - map.get(b).d);
    const cur = open.shift(), cd = map.get(cur).d, cx = KX(cur), cy = KY(cur);
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cx + dx, ny = cy + dy;
      if (!inBounds(nx, ny)) continue;
      const c = moveCost(u, nx, ny); if (c >= 99) continue;
      const o = unitAt(nx, ny); if (o && o.team !== u.team) continue;
      const nd = cd + c; if (nd > u.mov) continue;
      const nk = K(nx, ny), prev = map.get(nk);
      if (!prev || nd < prev.d){ map.set(nk, {d: nd, prev: cur}); open.push(nk); }
    }
  }
  return map;
}
const destinations = (u, map) => [...map.keys()].filter(k => { const o = unitAt(KX(k), KY(k)); return !o || o === u; });
function rangeTiles(fromKeys, rng){
  const out = new Set();
  for (const k of fromKeys){
    const x = KX(k), y = KY(k);
    for (let dy = -rng[1]; dy <= rng[1]; dy++) for (let dx = -rng[1]; dx <= rng[1]; dx++){
      const d = Math.abs(dx) + Math.abs(dy), nx = x + dx, ny = y + dy;
      if (d < rng[0] || d > rng[1] || !inBounds(nx, ny)) continue;
      out.add(K(nx, ny));
    }
  }
  return out;
}
function pathTo(map, k){ const p = []; while (k !== -1){ p.unshift(k); k = map.get(k).prev; } return p; }
function threat(u){
  if (u.w === 'staff') return new Set();
  return rangeTiles(u.ai === 'hold' ? [K(u.x, u.y)] : destinations(u, reach(u)), u.rng);
}
function updateDanger(){
  dangerKeys = new Set();
  if (showDanger) for (const e of team('e')) for (const k of threat(e)) dangerKeys.add(k);
}

// ---------- Combat math ----------
function calc(a, d, ap, dp){
  if (a.w === 'staff') return {can: false, dmg: 0, hit: 0, crit: 0, dbl: false, tri: 0};
  const t = ter(dp.x, dp.y), tri = triangle(a.w, d.w), dist = man(ap, dp);
  return {
    can: dist >= a.rng[0] && dist <= a.rng[1],
    dmg: Math.max(0, a.atk + tri - (d.def + t.def)),
    hit: clamp(75 + a.skl*2 + tri*15 - (d.spd*2 + t.avo), 0, 100),
    crit: clamp(Math.floor(a.skl/2) - Math.floor(d.skl/4), 0, 100),
    dbl: a.spd - d.spd >= 4, tri,
  };
}

// ---------- Map animation ----------
let popups = [], shots = [], banner = null, shake = 0;
function popup(u, text, color){ popups.push({x: u.x + .5, y: u.y + .3, text, color, t0: performance.now(), dur: 950}); }
async function moveAlong(u, path){
  for (let i = 1; i < path.length; i++){
    const fx = KX(path[i-1]), fy = KY(path[i-1]), tx = KX(path[i]), ty = KY(path[i]);
    await tween(80, t => { u.px = fx + (tx - fx)*t; u.py = fy + (ty - fy)*t; });
  }
  const last = path[path.length - 1];
  u.x = u.px = KX(last); u.y = u.py = KY(last);
}

// ---------- Battle scene (attacker left, defender right) ----------

const sideOf = u => duelSides[u.id] || (u.team === 'p' ? 'L' : 'R');

async function strike(a, d, f){
  const dx = d.x - a.x, dy = d.y - a.y, len = Math.hypot(dx, dy), ranged = man(a, d) > 1;
  const lx = dx/len*(ranged ? .12 : .32), ly = dy/len*(ranged ? .12 : .32);
  const duel = duelEl(), scene = !duel.hidden, A = dEl[sideOf(a)], D = dEl[sideOf(d)], dir = sideOf(a) === 'L' ? 1 : -1;
  if (scene) anim(A.querySelector('.pf'), [{transform: 'none'}, {transform: `translateX(${dir*(ranged ? 16 : 64)}px) rotate(${dir*3}deg)`}, {transform: 'none'}], 380, {easing: 'ease-in-out'});
  await tween(140, t => { a.ox = lx*t; a.oy = ly*t; });
  if (ranged){
    const s = {x0: a.x + .5, y0: a.y + .5, x1: d.x + .5, y1: d.y + .5, t: 0}; shots.push(s);
    await tween(170, t => { s.t = t; }); shots.splice(shots.indexOf(s), 1);
  }
  const roll = (Math.random()*100 + Math.random()*100)/2;   // two-roll hit, as in the classics
  if (roll < f.hit){
    const crit = Math.random()*100 < f.crit, dmg = crit ? f.dmg*3 : f.dmg;
    const from = d.hp; d.hp = Math.max(0, d.hp - dmg);
    popup(d, crit ? `${dmg}!` : String(dmg), crit ? '#ffd166' : '#ffffff');
    if (crit){ shake = 1; if (scene){ stamp('CRITICAL', '#ffcf5a'); anim(duel, [{transform: 'none'}, {transform: 'translate(-8px,5px)'}, {transform: 'translate(7px,-4px)'}, {transform: 'translate(-4px,2px)'}, {transform: 'none'}], 380); } }
    if (scene){
      duelPop(d, dmg === 0 ? 'NO DAMAGE' : String(dmg), crit ? '#ffcf5a' : '#fff');
      anim(D.querySelector('.pf'), [{filter: 'brightness(3) saturate(0)', transform: `translateX(${-dir*10}px)`}, {filter: 'none', transform: 'none'}], 340);
      setDuelHp(d);
    }
    tween(280, t => { d.flash = 1 - t; d.shp = from + (d.hp - from)*t; });
  } else {
    popup(d, 'Miss', '#c5d3e3');
    if (scene){ duelPop(d, 'MISS', '#c5d3e3'); anim(D.querySelector('.pf'), [{transform: 'none'}, {transform: `translateX(${-dir*26}px)`}, {transform: 'none'}], 380); }

      await wait(500);
    }
    await tween(380, t => { d.alpha = 1 - t; }); d.dead = true;
    if (d.team === 'e') B.kills++;
  }
}

async function doCombat(a, d){
  if ((a.boss || d.boss) && !bossTalked && B.ch.bossTalk){
    bossTalked = true;
    const r = a.boss ? d : a, retort = CHARACTERS[r.key]?.retort;
    await talk([...B.ch.bossTalk, ...(retort ? [{who: r.key, text: retort}] : [])]);
  }
  const A = calc(a, d, a, d), D = calc(d, a, d, a), seq = [[a, d, A]];

  const hp0 = {a: a.hp, d: d.hp};
  speed = 1;
  await openDuel(a, d);
  for (const [x, y, f] of seq){ if (a.dead || d.dead) break; await strike(x, y, f); }
  await closeDuel();
  speed = 1;
  const p = a.team === 'p' ? a : d, e = p === a ? d : a;
  if (!p.dead){
    const dealt = (p === a ? hp0.d - d.hp : hp0.a - a.hp) > 0;
    const xp = e.dead ? Math.max(10, 30 + (e.lv - p.lv)*3 + (e.boss ? 40 : 0)) : dealt ? Math.max(1, 10 + (e.lv - p.lv)) : 1;
    await giveExp(p, xp);
  }
}
async function doHeal(h, t){
  const amt = Math.min(healAmt(h), t.mhp - t.hp), from = t.hp;
  t.hp += amt; popup(t, `+${amt}`, '#9ff0b0');
  await tween(420, k => { t.shp = from + amt*k; t.flash = (1 - k)*.6; });
  await wait(200);
  if (h.team === 'p') await giveExp(h, 12);
}
async function giveExp(u, xp){
  popup(u, `+${xp} EXP`, '#ecc673');
  u.exp += xp;
  await wait(450);
  while (u.exp >= 100){ u.exp -= 100; await levelUp(u); }
}
async function levelUp(u){

// ---------- Player flow ----------
const enemiesInRange = u => team(u.team === 'p' ? 'e' : 'p').filter(o => { const d = man(u, o); return d >= u.rng[0] && d <= u.rng[1]; });
const healTargets = u => team(u.team).filter(o => o !== u && man(u, o) === 1 && o.hp < o.mhp);
function clearSel(){ sel = null; orig = null; reachMap = null; moveKeys = new Set(); atkKeys = new Set(); healKeys = new Set(); targets = []; fc = null; tmode = null; }

function select(u){
  clearSel(); inspect = null;
  sel = u; orig = {x: u.x, y: u.y}; reachMap = reach(u);
  moveKeys = new Set(destinations(u, reachMap));
  for (const k of rangeTiles(moveKeys, u.rng)) if (!moveKeys.has(k)) (u.w === 'staff' ? healKeys : atkKeys).add(k);
  mode = 'selected'; panelSelected(u); refreshTop();
}
function openActions(){
  mode = 'action'; moveKeys = new Set(); atkKeys = new Set(); healKeys = new Set(); targets = []; fc = null;
  for (const k of rangeTiles([K(sel.x, sel.y)], sel.rng)) (sel.w === 'staff' ? healKeys : atkKeys).add(k);
  panelActions(sel); refreshTop();
}
function startTargeting(kind){
  mode = 'target'; tmode = kind;
  targets = kind === 'attack' ? enemiesInRange(sel) : healTargets(sel);
  if (targets.length === 1) chooseTarget(targets[0]);
  else setPanel(`<div class="hint">Tap a highlighted ${kind === 'attack' ? 'enemy' : 'ally'}.</div><div class="acts"><button class="btn" data-act="back" type="button">Back</button></div>`);
}
function chooseTarget(t){ fc = t; tmode === 'attack' ? panelForecast(sel, t) : panelHeal(sel, t); }
async function afterAction(){
  mode = 'idle'; updateDanger();
  if (checkEnd()) return;
  panelIdle(); refreshTop();
  if (team('p').every(p => p.moved)){ await wait(350); enemyPhase(); }
}
async function finishUnit(u){ u.moved = true; clearSel(); await afterAction(); }

async function onTap(x, y){
  if (!B || busy || phase !== 'p') return;
  cursor = {x, y};
  const u = unitAt(x, y), k = K(x, y);
  if (mode === 'idle' || mode === 'selected'){
    if (mode === 'selected'){
      if (u === sel){ openActions(); return; }
      if (moveKeys.has(k) && !u){
        busy = true; refreshTop();
        await moveAlong(sel, pathTo(reachMap, k));
        busy = false; openActions(); return;
      }
    }
    if (u && u.team === 'p' && !u.moved){ select(u); return; }
    clearSel(); mode = 'idle';
    if (u){ inspect = u.team === 'e' && inspect !== u ? u : null; setPanel(unitHTML(u)); }
    else {
      inspect = null;
      const t = ter(x, y), ch = MAP[y][x];
      setPanel(`<div class="uhead"><span class="nm">${t.n}</span><span class="cl">${t.cost >= 99 ? 'Impassable' : `Move cost ${t.cost}`}</span></div>
        <div class="hint"><em>${t.note}</em></div>
        <div class="hint">${t.def || t.avo ? `Units here gain <b>+${t.def} Def</b> and <b>+${t.avo} Avoid</b>.` : 'No cover.'}${ch === 'F' ? ' Mounted units pay 3 to enter.' : ''}${ch === 'M' ? ' Mounted and armoured units cannot climb.' : ''}</div>`);
    }
    refreshTop(); return;
  }
  if (mode === 'action'){
    if (u && sel.w !== 'staff' && enemiesInRange(sel).includes(u)){ startTargeting('attack'); chooseTarget(u); }
    else if (u && sel.w === 'staff' && healTargets(sel).includes(u)){ startTargeting('heal'); chooseTarget(u); }
    return;
  }
  if (mode === 'target' && u && targets.includes(u)){ if (fc === u) act('confirm'); else chooseTarget(u); }
}

async function act(a){
  if (busy) return;
  if (a === 'attack') startTargeting('attack');
  else if (a === 'heal') startTargeting('heal');
  else if (a === 'wait') finishUnit(sel);
  else if (a === 'cancel'){ const u = sel; place(u, orig.x, orig.y); select(u); }
  else if (a === 'back') openActions();
  else if (a === 'confirm' && fc){
    busy = true; refreshTop();
    const u = sel, t = fc, kind = tmode; mode = 'busy'; targets = []; atkKeys = new Set(); healKeys = new Set();
    setPanel(`<div class="hint"><em>${kind === 'attack' ? `${u.name} strikes at ${t.name}…` : `${u.name} mends ${t.name}…`}</em></div>`);
    if (kind === 'attack') await doCombat(u, t); else await doHeal(u, t);
    busy = false;
    if (u.dead){ clearSel(); await afterAction(); return; }
    finishUnit(u);
  }
}

// ---------- Phases ----------
async function showBanner(text, sub, f){ banner = {text, sub, f, t0: performance.now(), dur: 1400}; await wait(1400); banner = null; }
async function fortHeal(t){
  for (const u of team(t)){
    if (ter(u.x, u.y).heal && u.hp < u.mhp){
      const amt = Math.min(u.mhp - u.hp, Math.max(1, Math.round(u.mhp*.2))), from = u.hp;
      u.hp += amt; popup(u, `+${amt}`, '#9ff0b0'); tween(300, k => { u.shp = from + amt*k; });
    }
  }
  await wait(300);
}
async function startPlayerPhase(){
  phase = 'p'; busy = true; mode = 'busy';
  for (const u of team('p')) u.moved = false;
  refreshTop(); panelIdle();
  await showBanner(FACTIONS[B.pf].playerLine, `Turn ${ROMAN(turn)}`, B.pf);
  await fortHeal('p');
  busy = false; mode = 'idle'; updateDanger(); panelIdle(); refreshTop();
}
async function spawnReinforcements(){
  const wave = B.waves.find(w => w.turn === turn);
  if (!wave) return;
  let first = true;
  for (const sp of wave.units){
    const u = enemyUnit(sp, B.ef); place(u, ...freeTileNear(sp.x, sp.y)); u.alpha = 0; units.push(u);
    if (first){ popup(u, 'Reinforcements!', '#ffcf5a'); first = false; }
    tween(400, t => { u.alpha = t; });
  }
  await wait(700);
}
async function enemyPhase(){
  clearSel(); inspect = null; phase = 'e'; busy = true; mode = 'busy'; refreshTop(); panelIdle();
  await showBanner(FACTIONS[B.ef].enemyLine, `Turn ${ROMAN(turn)}`, B.ef);
  await fortHeal('e');
  await spawnReinforcements();
  for (const e of team('e')){
    if (e.dead || B.done) continue;
    await aiAct(e);
    if (checkEnd()) return;
  }
  const ob = B.ch.objective;
  if (ob.type === 'survive' && turn >= ob.turns){ finishBattle(true); return; }
  turn++; busy = false;
  startPlayerPhase();
}

// ---------- Enemy AI ----------
function distField(e){
  const f = new Array(COLS*ROWS).fill(Infinity), open = [];
  for (const p of team('p')){ const k = K(p.x, p.y); f[k] = 0; open.push(k); }
  while (open.length){
    open.sort((a, b) => f[a] - f[b]);
    const cur = open.shift(), cx = KX(cur), cy = KY(cur);
    const step = f[cur] === 0 ? 1 : moveCost(e, cx, cy);
    if (step >= 99) continue;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cx + dx, ny = cy + dy; if (!inBounds(nx, ny) || moveCost(e, nx, ny) >= 99) continue;
      const nk = K(nx, ny), nd = f[cur] + step;
      if (nd < f[nk]){ f[nk] = nd; open.push(nk); }
    }
  }
  return f;
}
async function aiHeal(e){
  const map = e.ai === 'hold' ? new Map([[K(e.x, e.y), {d: 0, prev: -1}]]) : reach(e);
  let best = null;
  for (const dk of destinations(e, map)){
    const pos = {x: KX(dk), y: KY(dk)};
    for (const a of team('e')){
      if (a === e || a.hp >= a.mhp || man(pos, a) !== 1) continue;
      const need = a.mhp - a.hp - map.get(dk).d*.1;
      if (!best || need > best.need) best = {need, dk, a};
    }
  }
  if (!best) return;
  inspect = e; await wait(200);
  if (best.dk !== K(e.x, e.y)) await moveAlong(e, pathTo(map, best.dk));
  inspect = null; await doHeal(e, best.a);
}
async function aiAct(e){
  if (e.ai === 'guard' && !e.triggered){
    const th = e.w === 'staff' ? rangeTiles(destinations(e, reach(e)), [1, 2]) : threat(e);
    if (team('p').some(p => th.has(K(p.x, p.y)))) e.triggered = true; else return;
  }
  if (e.w === 'staff') return aiHeal(e);
  const map = e.ai === 'hold' ? new Map([[K(e.x, e.y), {d: 0, prev: -1}]]) : reach(e);
  const dests = destinations(e, map);
  let best = null;
  for (const dk of dests){
    const pos = {x: KX(dk), y: KY(dk)};
    for (const p of team('p')){
      const d = man(pos, p); if (d < e.rng[0] || d > e.rng[1]) continue;
      const A = calc(e, p, pos, p), D = calc(p, e, p, pos), hits = A.dbl ? 2 : 1;
      let score = A.dmg*A.hit/100*hits;
      if (A.dmg*hits >= p.hp) score += 40*A.hit/100;
      if (D.can) score -= D.dmg*D.hit/100*(D.dbl ? 2 : 1)*.4;
      score += ter(pos.x, pos.y).def*1.5 + (p.lord ? 2 : 0) - map.get(dk).d*.05;
      if (!best || score > best.score) best = {score, dk, p};
    }
  }
  inspect = e;
  if (best){
    await wait(250);
    if (best.dk !== K(e.x, e.y)) await moveAlong(e, pathTo(map, best.dk));
    await wait(150);
    inspect = null;
    await doCombat(e, best.p);
    updateDanger();
    return;
  }
  if (e.ai === 'hold'){ inspect = null; return; }
  const f = distField(e);
  let bk = K(e.x, e.y);
  for (const dk of dests) if (f[dk] < f[bk] || (f[dk] === f[bk] && map.get(dk).d < map.get(bk).d)) bk = dk;
  if (bk !== K(e.x, e.y)){ await wait(200); await moveAlong(e, pathTo(map, bk)); await wait(120); }
  inspect = null; updateDanger();
}

// ---------- End conditions ----------
function checkEnd(){
  if (!B || B.done) return true;
  const lord = units.find(u => u.team === 'p' && u.lord);
  if ((lord && lord.dead) || !team('p').length){ finishBattle(false); return true; }
  const ob = B.ch.objective, boss = units.find(u => u.boss);
  if (ob.type === 'boss' && boss && boss.dead){ finishBattle(true); return true; }
  const wavesLeft = B.waves.some(w => w.turn > turn || (w.turn === turn && phase === 'p'));
  if (!team('e').length && !(ob.type === 'survive' && wavesLeft)){ finishBattle(true); return true; }
  return false;
}

// ---------------- 45-render.js ----------------
// ================= Map rendering =================
const cvs = $('#cv'), ctx = cvs.getContext('2d'), boardEl = $('#board');
let T = 40, dpr = 1, terrCv = document.createElement('canvas'), tokenCache = new Map(), noisePat = null;
const isWater = (x, y) => inBounds(x, y) && (MAP[y][x] === 'W' || MAP[y][x] === 'B');

function resize(){
  if (!B) return;
  const r = boardEl.getBoundingClientRect();
  if (!r.width || !r.height) return;
  T = Math.max(20, Math.floor(Math.min(r.width/COLS, r.height/ROWS)));
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cvs.width = COLS*T*dpr; cvs.height = ROWS*T*dpr;
  cvs.style.width = COLS*T + 'px'; cvs.style.height = ROWS*T + 'px';
  terrCv.width = cvs.width; terrCv.height = cvs.height; tokenCache.clear();
  const g = terrCv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawTile(g, x, y, MAP[y][x]);
  if (!noisePat){
    const n = document.createElement('canvas'); n.width = n.height = 96; const ng = n.getContext('2d');
    for (let i = 0; i < 1400; i++){ ng.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.18)' : 'rgba(255,245,220,.12)'; ng.fillRect(Math.random()*96, Math.random()*96, 1, Math.random()*2 + .5); }
    noisePat = n;
  }
  g.globalAlpha = .55; g.fillStyle = g.createPattern(noisePat, 'repeat'); g.fillRect(0, 0, COLS*T, ROWS*T); g.globalAlpha = 1;
  const v = g.createRadialGradient(COLS*T/2, ROWS*T/2, Math.min(COLS, ROWS)*T*.45, COLS*T/2, ROWS*T/2, ROWS*T*.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(20,8,4,.5)'); g.fillStyle = v; g.fillRect(0, 0, COLS*T, ROWS*T);
}
function patch(g, X, Y, base, x, y){
  g.fillStyle = base; g.fillRect(X, Y, T, T);
  const h = hash(x, y, 9);
  g.save(); g.beginPath(); g.rect(X, Y, T, T); g.clip();
  if (h < .3){ g.fillStyle = 'rgba(255,255,230,.07)'; for (let i = 0; i < 3; i++){ g.fillRect(X + i*T/3 + T/12, Y, T/6, T); g.fillRect(X, Y + i*T/3 + T/12, T, T/6); } }
  else if (h < .55){ g.strokeStyle = 'rgba(0,0,0,.1)'; g.lineWidth = Math.max(1, T/22); for (let i = 1; i < 10; i++){ g.beginPath(); g.moveTo(X + i*T/10, Y); g.lineTo(X + i*T/10, Y + T); g.stroke(); } }
  else if (h < .75){ g.fillStyle = 'rgba(255,240,200,.13)'; for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++){ ell(g, X + (i + .5 + (j % 2)*.5)*T/4, Y + (j + .5)*T/4, T*.03, T*.03); g.fill(); } }
  g.restore();
  g.strokeStyle = 'rgba(15,22,8,.45)'; g.lineWidth = 1.5; g.strokeRect(X + .75, Y + .75, T - 1.5, T - 1.5);
  g.save(); g.setLineDash([T*.09, T*.07]); g.lineWidth = Math.max(1, T*.028); g.strokeStyle = 'rgba(240,228,200,.42)';
  g.strokeRect(X + T*.07, Y + T*.07, T*.86, T*.86); g.restore();
}
function hump(g, cx, base, rx, ry, col, stitchCol){
  g.fillStyle = col; g.beginPath(); g.ellipse(cx, base, rx, ry, 0, Math.PI, 0); g.closePath(); g.fill();
  g.save(); g.beginPath(); g.ellipse(cx, base, rx*.86, ry*.84, 0, Math.PI*1.08, Math.PI*1.92); g.setLineDash([T*.06, T*.05]); g.lineWidth = Math.max(1, T*.025); g.strokeStyle = stitchCol; g.stroke(); g.restore();
}
function drawTile(g, x, y, ch){
  const X = x*T, Y = y*T, greens = ['#5d8a43', '#67944b', '#557f3d', '#6e9a52'];

// ================= Dialogue & level-up cards =================
// Lines: {who, text, if?:flag, unless?:flag}. Lines whose flag test fails are skipped.
const linesFor = lines => (lines || []).filter(l => (!l.if || SAVE.flags[l.if]) && (!l.unless || !SAVE.flags[l.unless]));

function talk(rawLines){
  const lines = linesFor(rawLines);
  if (!lines.length) return Promise.resolve();
  return new Promise(res => {
    const ov = $('#talk'), txt = $('#ttext'), box = $('#tbody'), por = $('#tpor'), nm = $('#tname'), skip = $('#skip');
    let i = -1, typing = null, full = '';
    const finish = () => { ov.hidden = true; skip.hidden = true; ov.onclick = null; skip.onclick = null; clearInterval(typing); res(); };
    const show = () => {
      i++; if (i >= lines.length) return finish();
      const l = lines[i], sp = SPEAKERS[l.who] || SPEAKERS.narr, narr = l.who === 'narr';
      box.className = 'tbody' + (narr ? ' narr' : '');
      por.hidden = narr; nm.hidden = narr;
      if (!narr){
        por.className = 'tpor f-' + sp.faction;
        por.innerHTML = portraitInner(l.who, sp.look, 'talk');
        nm.className = 'tname f-' + sp.faction; nm.textContent = sp.name;
      }
      full = l.text; let n = 0; txt.textContent = '';
      clearInterval(typing);
      typing = setInterval(() => { n += 2; txt.textContent = full.slice(0, n); if (n >= full.length){ clearInterval(typing); typing = null; } }, 22);
    };
    ov.onclick = () => { if (typing){ clearInterval(typing); typing = null; txt.textContent = full; } else show(); };
    skip.onclick = e => { e.stopPropagation(); finish(); };
    ov.hidden = false; skip.hidden = false; show();
  });
}

// u is anything with name, lv, key, look, faction, w and flat stats (a battle unit, or a record's stats spread in).
function showLevelUp(u, ups){
  const label = {mhp: 'HP', atk: u.w === 'staff' ? 'Mag' : 'Atk', def: 'Def', spd: 'Spd', skl: 'Skl'};
  $('#lvlCard').innerHTML = `<div class="urow"><div class="por f-${u.faction}">${portraitInner(u.key, u.look, 'panel')}</div>
    <div class="uinfo"><h1>LEVEL UP</h1><h2>${u.name} · Level ${u.lv}</h2></div></div>
    <div class="lv">${STAT_KEYS.map(s => `<div class="${ups[s] ? 'up' : ''}"><small>${label[s]}</small>${u[s]}${ups[s] ? ' ▲' : ''}</div>`).join('')}</div>
    <p class="meta">The cause grows stronger. Tap to continue.</p>`;
  $('#lvl').hidden = false;
  return new Promise(res => {
    const done = () => { $('#lvl').hidden = true; $('#lvl').removeEventListener('click', done); clearTimeout(tm); res(); };
    const tm = setTimeout(done, 2800);
    setTimeout(() => $('#lvl').addEventListener('click', done), 250);
  });
}

  if (st.s === 'next') return `<div class="node"><div class="pin next">${n}</div><div class="ncard">
      <h3>${ch.title}</h3><div class="nmeta">${ch.brief}</div>
      <div class="chips"><span class="chip">${objectiveLabel(ch.objective)}</span><span class="chip">vs ${FACTIONS[ch.enemyFaction].name}</span>${conv}${ch.bonus ? `<span class="chip bonus">Bonus: ${ch.bonus.text}</span>` : ''}</div>
      <button class="btn primary" data-play="${i}" type="button">Prepare for Battle</button></div></div>`;
  if (st.s === 'gate'){
    const other = findChapter(st.missing[0]).camp;
    return `<div class="node"><div class="pin gate">${n}</div><div class="ncard">
      <h3>${ch.title}</h3><div class="chips">${conv}</div>
      <div class="gatebox"><span>The stories meet here. Before this chapter can begin, the other side must reach the same moment. Clear <b>${st.missing.map(chapterRef).join('</b> and <b>')}</b>.</span>
      <button class="btn" data-camp="${other}" type="button">Switch to the ${FACTIONS[CAMPAIGNS[other].faction].name}</button></div></div></div>`;
  }
  if (st.s === 'stub') return `<div class="node"><div class="pin stub">${n}</div><div class="ncard dim"><h3>${ch.title}</h3><div class="nmeta">${ch.brief}</div></div></div>`;
  return `<div class="node"><div class="pin future">${n}</div><div class="ncard dim"><h3>${ch.title}</h3><div class="chips">${conv}<span class="chip">Locked</span></div></div></div>`;
}
function renderHub(){
  const ck = SAVE.current, camp = campOf(), st = stOf(), F = FACTIONS[camp.faction];
  const lord = st.roster.find(r => r.lord), alive = living(ck);
  const art = ART[camp.lord]?.portrait || plushPortrait(lord.look);
  const avg = Math.round(alive.reduce((a, r) => a + r.lv, 0)/alive.length*10)/10;
  $('#hub').innerHTML = `<div class="sin f-${camp.faction}">
    <div class="sbar"><h1>RAEPUBLIC</h1><button class="btn" data-go="title" type="button">Title</button></div>
    <div class="fswitch" role="tablist" aria-label="Choose a story">${Object.entries(CAMPAIGNS).map(([k, c]) =>
      `<button class="f-${c.faction}${k === ck ? ' on' : ''}" data-camp="${k}" role="tab" aria-selected="${k === ck}" type="button">${FACTIONS[c.faction].name}<small>${progressLabel(k)}</small></button>`).join('')}</div>
    <div class="hero f-${camp.faction}">
      <div class="himg"><img alt="${lord.name}" src="${art}"></div>
      <div><h2>${camp.name}</h2><div class="tagl">${camp.tagline}</div>
        <div class="hstats"><span><b>${st.res}</b> ${F.currency}</span><span><b>${alive.length}</b> in the army</span><span>Avg Lv <b>${avg}</b></span></div>
        <button class="btn" data-go="army" type="button">Army &amp; Armoury</button></div>
    </div>
    <div class="sec">Chapters</div>
    <div class="track">${camp.chapters.map((ch, i) => nodeHTML(ck, ch, i)).join('')}</div>
  </div>`;
  showScreen('hub');
}

// ---------- Army ----------
let armyTab = 'roster', armyReturn = 'hub';
function statsGrid(rec){
  const s = rec.stats, tb = WEAPON_TIERS[rec.wtier || 0].bonus, w = CLASSES[rec.cls].w;
  return `<div class="stats">${[['HP', s.mhp], [w === 'staff' ? 'Mag' : 'Atk', s.atk + tb], ['Def', s.def], ['Spd', s.spd], ['Mov', s.mov]]
    .map(([l, v]) => `<div><small>${l}</small><span>${v}</span></div>`).join('')}</div>`;
}
function recCard(rec, actions = '', extraClass = ''){
  const c = CLASSES[rec.cls];
  return `<div class="ucard ${extraClass}${rec.dead ? ' dead' : ''}" data-uid="${rec.uid}">
    <div class="por f-${rec.faction}">${portraitInner(rec.key, rec.look, 'panel')}</div>
    <div class="uinfo"><div class="uhead"><span class="nm">${rec.name}</span><span class="cl">${c.name} · Lv ${rec.lv}</span></div>
      <div class="ustat"><b>${weaponName(rec)}</b> · ${WTYPE[c.w]}${rec.lord ? ' · <span class="tick">Leader</span>' : ''}${rec.dead ? ' · <span class="tick">Unstitched</span>' : ''}</div>
      <div class="ustat">EXP ${rec.exp}/100</div><div class="xp"><i style="width:${rec.exp}%"></i></div></div>
    ${statsGrid(rec)}${actions}</div>`;
}
function renderArmy(){
  const ck = SAVE.current, camp = campOf(), st = stOf(), F = FACTIONS[camp.faction];
  let body = '';
  if (armyTab === 'roster'){
    const alive = st.roster.filter(r => !r.dead), fallen = st.roster.filter(r => r.dead);
    body = `<div class="hint">Drill a unit for experience, or upgrade its weapon. Fallen units do not return.</div><div class="ulist">${alive.map(r => {
      const next = WEAPON_TIERS[(r.wtier || 0) + 1];
      return recCard(r, `<div class="uacts">
        <button class="btn" data-train="${r.uid}" type="button" ${st.res < TRAIN.cost || r.lv >= 20 ? 'disabled' : ''}>Drill +${TRAIN.exp} EXP · ${TRAIN.cost}</button>
        ${next ? `<button class="btn" data-arm="${r.uid}" type="button" ${st.res < next.cost ? 'disabled' : ''}>${next.prefix.trim()} · ${next.cost}</button>` : '<button class="btn" type="button" disabled>Weapon mastered</button>'}
      </div>`);
    }).join('')}</div>${fallen.length ? `<div class="sec">Unstitched</div><div class="ulist">${fallen.map(r => recCard(r)).join('')}</div>` : ''}`;
  } else {
    const open = recruitOptions(ck), lv = recruitLevel(ck);
    const locked = camp.recruits.filter(r => !open.includes(r));
    body = `<div class="hint">New recruits join at level ${lv}, close to the rest of the army.</div><div class="ulist">${open.map(r => {
      const preview = {uid: 'preview-' + r.cls, key: 'recruit', name: CLASSES[r.cls].name, faction: camp.faction, cls: r.cls, look: CLASS_LOOK[r.cls], lv, exp: 0, stats: scaledStats(r.cls, lv), wtier: 0, wname: CLASSES[r.cls].wname};
      return recCard(preview, `<div class="uacts"><button class="btn primary" data-recruit="${r.cls}" type="button" ${st.res < r.cost ? 'disabled' : ''}>Recruit · ${r.cost}</button></div>`);
    }).join('') || '<div class="empty">No one is ready to enlist yet.</div>'}</div>
    ${locked.length ? `<div class="sec">Later</div><div class="ulist">${locked.map(r => `<div class="ncard dim"><h3>${CLASSES[r.cls].name}</h3><div class="nmeta">Enlists after <b>${chapterRef(r.after)}</b>.</div></div>`).join('')}</div>` : ''}`;
  }
  $('#army').innerHTML = `<div class="sin f-${camp.faction}">
    <div class="sbar"><button class="btn" data-go="${armyReturn}" type="button">‹ Back</button><h1>Army</h1><div class="res">${st.res}<small>${F.currency}</small></div></div>
    <div class="tabs"><button class="btn${armyTab === 'roster' ? ' on' : ''}" data-tab="roster" type="button">Roster</button><button class="btn${armyTab === 'recruit' ? ' on' : ''}" data-tab="recruit" type="button">Recruit</button></div>
    ${body}</div>`;
  showScreen('army');
}
async function trainUnit(uid){
  const st = stOf(), rec = st.roster.find(r => r.uid === uid);
  if (!rec || st.res < TRAIN.cost) return;
  st.res -= TRAIN.cost; rec.exp += TRAIN.exp;
  while (rec.exp >= 100 && rec.lv < 20){
    rec.exp -= 100; rec.lv++;
    const ups = rollLevel(rec.stats, growthOf(rec));
    await showLevelUp({...rec, ...rec.stats, atk: rec.stats.atk + WEAPON_TIERS[rec.wtier || 0].bonus, w: CLASSES[rec.cls].w}, ups);
  }
  if (rec.lv >= 20) rec.exp = 0;
  saveGame(); renderArmy();
}
function upgradeWeapon(uid){
  const st = stOf(), rec = st.roster.find(r => r.uid === uid), next = rec && WEAPON_TIERS[(rec.wtier || 0) + 1];
  if (!next || st.res < next.cost) return;
  st.res -= next.cost; rec.wtier = (rec.wtier || 0) + 1;
  saveGame(); toast(`${rec.name} now carries the ${weaponName(rec)}.`); renderArmy();
}
function recruit(cls){
  const ck = SAVE.current, st = stOf(), opt = CAMPAIGNS[ck].recruits.find(r => r.cls === cls);
  if (!opt || st.res < opt.cost) return;
  st.res -= opt.cost; const rec = makeRecruit(ck, cls); st.roster.push(rec);
  saveGame(); toast(`${rec.name} joins the ${FACTIONS[rec.faction].name}.`); renderArmy();
}

// ---------- Battle preparation ----------
let prep = null;   // {ck, i, picks:Set(uid)}
function openPrep(ck, i){
  const ch = CAMPAIGNS[ck].chapters[i], alive = living(ck);
  const max = Math.min(ch.maxDeploy, ch.deploy.length);
  const order = [...alive.filter(r => r.lord), ...alive.filter(r => !r.lord)];
  if (!prep || prep.ck !== ck || prep.i !== i) prep = {ck, i, picks: new Set(order.slice(0, max).map(r => r.uid))};
  for (const uid of [...prep.picks]) if (!alive.some(r => r.uid === uid)) prep.picks.delete(uid);
  renderPrep();
}
function renderPrep(){
  const {ck, i} = prep, camp = CAMPAIGNS[ck], ch = camp.chapters[i], alive = living(ck);
  const max = Math.min(ch.maxDeploy, ch.deploy.length), order = [...alive.filter(r => r.lord), ...alive.filter(r => !r.lord)];
  $('#prep').innerHTML = `<div class="sin f-${camp.faction}">
    <div class="sbar"><button class="btn" data-go="hub" type="button">‹ Back</button><h1>Prepare</h1><div class="res">${stOf().res}<small>${FACTIONS[camp.faction].currency}</small></div></div>
    <div class="brief"><div class="kick">${camp.name} · Chapter ${ROMAN(i + 1)}${ch.convergence ? ' · Convergence' : ''}</div><h2>${ch.title}</h2><p>${ch.brief}</p>
      <div class="chips"><span class="chip">${objectiveLabel(ch.objective)}</span><span class="chip">vs ${FACTIONS[ch.enemyFaction].name}</span>${ch.bonus ? `<span class="chip bonus">Bonus: ${ch.bonus.text}</span>` : ''}</div></div>
    <div class="sec">Deploy ${prep.picks.size} of ${max}</div>
    <div class="ulist">${order.map(r => recCard(r, '', 'pick' + (prep.picks.has(r.uid) ? ' on' : ''))).join('')}</div>
    <div class="sticky"><button class="btn" data-go="army" data-from="prep" type="button">Army</button><button class="btn primary" data-begin type="button">Begin Battle</button></div>
  </div>`;
  showScreen('prep');
}
function togglePick(uid){
  const ch = CAMPAIGNS[prep.ck].chapters[prep.i], rec = SAVE.camps[prep.ck].roster.find(r => r.uid === uid), max = Math.min(ch.maxDeploy, ch.deploy.length);
  if (!rec) return;
  if (rec.lord){ toast(`${rec.name} leads every battle.`); return; }
  if (prep.picks.has(uid)) prep.picks.delete(uid);
  else if (prep.picks.size >= max){ toast(`Only ${max} can deploy here.`); return; }
  else prep.picks.add(uid);
  renderPrep();
}

// ---------- Playing a chapter ----------
async function playChapter(){
  const {ck, i} = prep, camp = CAMPAIGNS[ck], ch = camp.chapters[i], st = SAVE.camps[ck];
  const recs = [...st.roster.filter(r => r.lord), ...st.roster.filter(r => !r.lord && prep.picks.has(r.uid))].filter(r => !r.dead);
  await talk(ch.pre);
  const res = await runBattle(ck, ch, recs);
  const kills = B.kills;
  if (!res.win){
    B = null;
    renderResult({win: false, retreated: res.retreated, ck, i});
    return;
  }
  // Commit the battle to the permanent army.
  for (const u of res.survivors){
    const r = u.rec;
    r.lv = u.lv; r.exp = u.exp;
    r.stats = {mhp: u.mhp, atk: u.atk - u.tb, def: u.def, spd: u.spd, skl: u.skl, mov: u.mov};
  }
  for (const u of res.lost) u.rec.dead = true;
  const bonusHit = ch.bonus?.type === 'noLosses' && res.lost.length === 0;
  if (bonusHit) SAVE.flags[ch.bonus.flag] = true;
  for (const f of ch.reward.flags || []) SAVE.flags[f] = true;
  const spoils = ch.reward.res + kills*20;
  st.res += spoils;
  const joined = [];
  for (const key of ch.reward.joins || []) if (!st.roster.some(r => r.key === key)){ st.roster.push(recordFor(key)); joined.push(CHARACTERS[key].name); }
  st.cleared.push(ch.id);
  saveGame();
  await talk(ch.post);
  B = null;
  renderResult({win: true, ck, i, turn: res.turn, kills, spoils, joined, lost: res.lost.map(u => u.name), bonusHit});
}

function renderResult(r){
  const camp = CAMPAIGNS[r.ck], ch = camp.chapters[r.i], F = FACTIONS[camp.faction];
  let html;
  if (r.win){
    const other = otherCamp(r.ck), opened = CAMPAIGNS[other].chapters
      .map((c, j) => ({c, j})).filter(({c, j}) => (c.requires || []).includes(ch.id) && chapterState(other, j).s === 'next');
    html = `<div class="brief"><div class="kick">Victory · ${camp.name} · Chapter ${ROMAN(r.i + 1)}</div><h2>${ch.title}</h2><p>Won on turn ${ROMAN(r.turn)}.</p></div>
      <div class="rlist">
        <div><span>Spoils</span><b>+${r.spoils} ${F.currency}</b></div>
        <div><span>Foes unstitched</span><b>${r.kills}</b></div>
        ${r.joined.length ? `<div><span>Joined the army</span><b>${r.joined.join(', ')}</b></div>` : ''}
        ${ch.bonus ? `<div><span>${ch.bonus.text}</span><b>${r.bonusHit ? '★ Achieved' : 'Missed'}</b></div>` : ''}
        ${r.lost.length ? `<div><span>Unstitched for good</span><b>${r.lost.join(', ')}</b></div>` : ''}
      </div>
      ${opened.map(({c, j}) => `<div class="gatebox"><span>The other story can now go on: <b>${chapterRef(c.id)}</b>.</span><button class="btn" data-camp="${other}" type="button">Switch to the ${FACTIONS[CAMPAIGNS[other].faction].name}</button></div>`).join('')}
      <div class="sticky"><button class="btn primary" data-go="hub" type="button">Continue</button></div>`;
  } else {
    html = `<div class="brief"><div class="kick">${r.retreated ? 'Retreat' : 'Defeat'} · ${camp.name}</div><h2>${ch.title}</h2>
      <p>${r.retreated ? 'You pulled back from the field.' : `${CHARACTERS[camp.lord].name} has fallen.`} Nothing was lost: your army is exactly as it was before the battle.</p></div>
      <div class="sticky"><button class="btn" data-go="hub" type="button">Campaign</button><button class="btn primary" data-retry type="button">Try Again</button></div>`;
  }
  $('#result').innerHTML = `<div class="sin f-${camp.faction}">${html}</div>`;
  showScreen('result');
}

// ---------- Screen input ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button, .ucard.pick');
  if (!t || !t.closest('.screen')) return;
  const d = t.dataset;
  if (d.camp){ SAVE.current = d.camp; saveGame(); renderHub(); }
  else if (d.go === 'hub') renderHub();
  else if (d.go === 'army'){ armyReturn = d.from || 'hub'; renderArmy(); }
  else if (d.go === 'prep') renderPrep();
  else if (d.go === 'title'){ $('#contBtn').hidden = false; $('#title').hidden = false; }
  else if (d.tab){ armyTab = d.tab; renderArmy(); }
  else if (d.train) trainUnit(d.train);
  else if (d.arm) upgradeWeapon(d.arm);
  else if (d.recruit) recruit(d.recruit);
  else if (d.play !== undefined) openPrep(SAVE.current, +d.play);
  else if ('begin' in d) playChapter();
  else if ('retry' in d) openPrep(prep.ck, prep.i);
  else if (t.classList.contains('pick')) togglePick(d.uid);
});

// ---------- Title ----------
const INTRO = [
  {who: 'narr', text: 'This is a chronicle of one war, told from both sides of it.'},
  {who: 'narr', text: 'Lead the Raepublic or the Friggliarchy, and switch between them whenever you like.'},
  {who: 'narr', text: 'At certain crossroads the two stories meet. Neither can go on until both have reached that moment.'},
];
$('#contBtn').addEventListener('click', () => {
  SAVE = SAVE || Store.load();
  if (!SAVE) return;
  $('#title').hidden = true; renderHub();
});
$('#newBtn').addEventListener('click', async e => {
  if ((SAVE || Store.load()) && !armed(e.currentTarget, 'Tap again to erase your save')) return;
  SAVE = newSave(); saveGame(); prep = null;
  $('#title').hidden = true; renderHub();
  await talk(INTRO);
});

// ---------------- 90-main.js ----------------
// ================= Boot =================
validateMaps();
function boot(data){
  SAVE = (data && data.save) || Store.load();
  $('#titleArt').src = ART.rae?.portrait || plushPortrait('rae');
  $('#contBtn').hidden = !SAVE;
  if (data && data.save){ $('#title').hidden = true; renderHub(); }   // returning from a live update
  requestAnimationFrame(frame);
  document.fonts?.ready?.then(() => { tokenCache.clear(); resize(); });
}
// Keep the campaign when the page is updated while open (a battle in progress restarts from the hub).
window.claude?.hot?.snapshot?.(() => SAVE ? {save: SAVE} : {});
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
// Test hook, only with #debug in the address: lets automated checks force a battle result.
if (location.hash === '#debug') window.RAE_DEBUG = {win: () => finishBattle(true), lose: () => finishBattle(false), save: () => SAVE};

})();
</script>
